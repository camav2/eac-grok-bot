                        - text: I'M MORE INTERESTED IN THE AFTER-AFTER.I've had a bit of a sabbatical from talking about my personal style work.Not because I stopped loving it. I just got fed up with the traditional idea of what a “stylist” does.Particularly the "makeover".Someone chooses your clothes, does your hair and make-up, there's a big TADAAAA! moment and everyone gasps at the transformation.But what happens three days later when you're getting dressed for work?❌️I don't want you to look fabulous because I've put an outfit together for you.✔️I want you to know what to do when I'm not there.One of my clients once described the result of our work together beautifully “My wardrobe just makes sense.” And because it made sense “I've got more brain space.”🩷 That's the AFTER-after I'm interested in.🩷✔️Knowing what you love. ✔️Shopping with more clarity. ✔️Making fewer expensive mistakes. ✔️Getting dressed without using so much bloody brain space. ✔️Knowing YES / NO / NOT ME without needing somebody else to decide for you.Clothes are a tool in my work. But the work is never really just about clothes.So I'm ready to talk about SPARKLE again.Four 90-minute 1:1 sessions (plus me in your pocket via WhatsApp for 6 months) using colour, clothes, proportion, personal style and self-expression to help you build something that still works when I'm nowhere bloody near you.No makeover. No “new you”. No "rules"SPARKLE is £1,000, if you'd like to know more get in touch to book a no obligation chat. I'm opening 3 spaces between now and Christmas.
