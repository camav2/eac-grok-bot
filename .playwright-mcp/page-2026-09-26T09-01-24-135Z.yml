                        - text: "I used to do my most important work at the worst possible time of day. Not because I planned it that way.It just ended up there.My days were full of meetings and calls, so the work that actually mattered – like sitting down and properly reviewing what my teams had produced – kept getting pushed to the evenings and weekends.So I was doing the most important part of my job when I was tired and would rather have been doing almost anything else. What I eventually realised, after 20 years around senior leaders, is that the people who succeed aren't working more than everyone else. They've just figured out a few small things about where their effort goes. Three of them stood out: ✅ They do the work that matters first, before the day has a chance to take it from them ✅ They don't treat every message like it needs an instant reply – they decide in advance what actually deserves a fast response ✅ They know when something is finished, instead of polishing the final 5% that doesn't change the outcome None of these are dramatic, and they're almost boring.Which is probably why most people overlook them for years. I break down all three in the video, including the one most high performers really don't want to hear. Watch the full 7-minute video on YouTube:"
