                    - paragraph [ref=f35e2372]:
                      - generic [ref=f35e2373]:
                        - text: "When did we become so reluctant to be mediocre at things we enjoy? 😂Start running and someone asks your time.Take photographs and eventually somebody wonders whether you could sell them.Bake a decent Victoria sponge and apparently you're only three strategic decisions away from launching a hospitality business.Even hobbies can start acquiring performance reviews. And possibly a spreadsheet. With conditional formatting.But perhaps not everything we enjoy needs to become something we're good at. Or something we improve. Or measure. Or monetise. Or even show anybody else.Sometimes “I enjoy doing this” is a perfectly complete reason to keep doing it.Children seem to understand this rather well.Give a child some Lego and they'll build something because building it is fun.They're unlikely to pause halfway through and ask “Have you considered monetising the castle?”As adults, though, we can become uncomfortable with being beginners.We try something new and announce “I'm not very good at this.”Well...you've been doing it for eleven minutes. 😂Perhaps being good at something and enjoying something don't have to be connected.You can sing loudly in the car without troubling the recording industry.Play golf while exploring parts of the course the designer never intended.Paint something that appears to belong to an entirely different biological kingdom from the thing you were attempting to paint.Walk without turning it into a step target.Read without setting a reading goal.Cook something without photographing it.Write something nobody else will ever read.Learn three chords on a guitar and remain perfectly content with those three chords.There's a lovely word we don't use enough as adults - Play.Doing something because we enjoy the experience of doing it.Not because we're trying to become impressive at it.One question from today's Lighter Than You Started is:Instead of asking “Am I good at this?” try “Do I enjoy myself while I'm doing it?”Maybe that's enough.Perhaps this weekend we could all have one thing we're allowed to be thoroughly average at. No targets. No performance review. No personal-development plan.Just “Did I enjoy that?”🎙️ Episode 269: You Don't Need to Be Good at Something to Enjoy It🎧 You can listen to today’s episode at Apple Podcasts, Spotify, Audible and all major podcast platforms or on Alexa just say “Alexa, play the Lighter Than You Started podcast”.Today's thought:Some things are worth doing simply because you like who you are while you're doing them."
