                  - paragraph [ref=f87e195]:
                    - generic [ref=f87e196]:
                      - text: Talking about perimenopause at work plays an important role in lifting awareness and understanding.
                      - strong [ref=f87e197]: Sonya Choi La Rosa (ACC)
                      - text: kindly provided this opportunity to do so on her wonderful podcast ‘Style & Strategy with Sonya’.We enjoyed a meaningful conversation on what I believe is one of the best podcasts I have been on!I hope you pause to listen and share this with your colleagues and friends. We hope that it will support them in their journey in the workplace and help them continue their longterm sustainable careers through perimenopause and menopause.Be sure to check the comments for the links to the podcast.
                      - strong [ref=f87e198]: "#madaboutmenopause"
                      - strong [ref=f87e199]: "#menopauseatwork"
                      - strong [ref=f87e200]: "#madaboutmenopauseatwork"
                      - text: =======================I’m Karen Stein, an Executive Coach, and Certified Menopause Coach who is “M.A.D” about menopause™️ (making a difference at work). I support midlife leaders to have long term sustainable careers, filled with confidence, clarity and connectedness.
