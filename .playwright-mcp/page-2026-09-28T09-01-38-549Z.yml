                    - paragraph [ref=f87e231]:
                      - link [ref=f87e232] [cursor=pointer]:
                        - /url: https://www.linkedin.com/feed/update/urn:li:ugcPost:7507692600565575680/
                        - generic [ref=f87e233]: She cried in the car on the way to work. Pulled herself together in the lift, did the day, then cried again on the drive home.Nothing was wrong at work or at home.
                      - link "View Karen Stein’s profile" [ref=f87e235] [cursor=pointer]:
                        - /url: https://www.linkedin.com/in/karen-stein-coaching/
                        - strong [ref=f87e236]: Karen Stein
                      - text: "spent 29 years at Deloitte, 24 of them as a partner, and by then she was coaching women partners through exactly the career stage she was standing in. Her hair started thinning. Leg cramps were wrecking her sleep. Her blood pressure spiked enough that she was sent to a cardiologist for stress tests.Every test came back clear. Nobody said the word perimenopause.She found it in her own research, and then asked the question that became her body of work. If that is happening to me, what is happening to every other woman in the building?Here is why it belongs in a leadership conversation rather than a health one. When this arrives, a leader does not stop. She compensates. She over-prepares for the meeting she used to walk into cold. She books the hard conversation for ten in the morning because she knows what she is like by four. She says a little less in the rooms she used to run.Which reads, from the outside, like confidence going.Karen's words, and the reason I wanted this conversation on the show:\"It's not that they've lost their capability, it's just that they've lost their capacity to act in that moment.\"Capability is not what moved. Capacity did, temporarily, and it comes back.The full conversation is out now on Style & Strategy. Tune into the podcast here:"
