                        - text: I thought writing the book would be the hard part. It wasn’t. The hard part has been everything that came after it. Trying to work out what to do myself, what to outsource, how often to talk about the book without feeling like a broken record, where to show up, who to speak to and what people should do after they finish reading it. Reaching 1,000 copies sold made me stop and think about the things I’ve learned along the way. Some I got right. Some I learned the hard way. I’ve shared five of them in this week’s newsletter. A big thank you to
                        - link [ref=e3594]:
                          - /url: /in/jordonlott/
                          - text: Jordon Lott
                        - text: ", my commissioning editor, and the"
                        - link [ref=e3595]:
                          - /url: https://www.linkedin.com/company/john-wiley-and-sons/
                          - generic [ref=e3596]: Wiley
                        - text: team for backing the book and helping me get it into the world. Thanks also to the
                        - link [ref=e3597]:
                          - /url: https://www.linkedin.com/company/expert-author-community/
                          - generic [ref=e3598]: Expert Author Community
                        - text: . Being part of that group while I was writing made a huge difference. And to everyone who has bought it, recommended it, interviewed me, invited me to speak, stocked it, shared it or simply had a conversation with me about it, thank you. The 1,000 copies matter. But the conversations they have started matter more.
