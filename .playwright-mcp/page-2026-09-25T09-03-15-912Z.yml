                      - generic [ref=e2470]: "Having a glass to celebrate a pretty big milestone-- My manuscript is finally IN! 🥂 For almost two years of writing -- my office floor has become my desk. It’s where I feel most grounded, creative and give myself permission to be messy. Index cards and Sharpies have been the tools to build out my chapters: Fear. Control. Regret. People-Pleasing. Achieving. I will be sharing a sneak peek soon, but in the meantime I would love more future readers. My list is growing! You can subscribe in the comments below 👇🏻 for monthly updates, including tips on how to navigate your own sticky moments. Appreciate your support!"
