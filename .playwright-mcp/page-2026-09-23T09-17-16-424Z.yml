                                                    - strong: Rachel Holdsworth
                                                - text: .What stayed with me most was the openness in the room, the willingness to reflect not only on children’s behaviour, but on
                                                - strong: what happens within us in relationship with them
                                                - text: ".That takes courage.Because understanding behaviour isn’t simply about asking, “What is this child doing?” It’s also being willing to ask:"
                                                - strong: “Am I responding to the child in front of me, or reacting from the child within me?”
