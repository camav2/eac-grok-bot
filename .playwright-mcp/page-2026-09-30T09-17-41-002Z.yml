                        - generic [ref=f172e366]:
                          - text: "I love that what starts as an idea ends in community.Bringing a book into the world is a long creative journey that requires focus, persistence and huge amounts of input.It’s not only about the end product and its effect on others, but the person you become in the process of creating it and those you gather on the journey. I've loved it.The seed for my new book Seen Again: Light on Matrescence started in my Illuminate coaching program for mothers, was nurtured by the"
                          - link "Kelly Irving" [ref=f172e368] [cursor=pointer]:
                            - /url: /in/kelly-irving/
                          - text: and the
