                          - generic [ref=f172e243]:
                            - text: I’ve spend years trying to reframe the narrative around a lack of access to childcare being simply a “family issue”. Not having access to this critical infrastructure has wide spread eccominc implications which are most often than not amplified in rural and remote communities.This week, the data caught up with the reality. One week into our Regional Childcare Access Survey bring delivered in partnership with
                            - link "RAPAD - Remote Area Planning and Development Board" [ref=f172e244] [cursor=pointer]:
                              - /url: https://www.linkedin.com/company/rapad/
                            - text: the numbers are stark. Some families are losing close to $90,000 a year because they can’t access childcare.Not because they chose not to access care. Because there is no service available.Here is the part most people miss.Government childcare data counts who is using subsidised care. It does not count who needs care and can't access it. So when a town has no approved provider, it shows up as zero demand instead of unmet need.The communities most underserved become the most invisible to the people funding the solutions. We are written out of the data before the conversation even starts.That is the gap we are working to close. Not simply by building more centres, but by also strengthening the flexible CCS-eligible models that already fit regional life. In-Home Care. Family Day Care. In-Venue Care. While simultaneously collecting the data and cost of having to rely on informal care arrangements which can include, Nannie’s, Au Pairs and even grandparents because there is no approved provider. Together we are creating a first of its kind evidence base which will make the case for change.If your region is wrestling with the same problem and you want to know what we are doing about it, reach out. Together we are stronger ✌️
