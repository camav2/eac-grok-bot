                                - text: This year, 28 books from the
                                - link "Expert Author Community" [ref=f172e674]:
                                  - /url: https://www.linkedin.com/company/expert-author-community/
                                - text: "have been released.That feels huge to me.Because in a world full of fast content, these books remind us why this work matters so much: books still give ideas space. They still build trust. They still help real voices stand out.I’m incredibly proud of these authors, and very grateful that through the EAC, I get to support work like this.I wrote more about our 28 books, the authors behind them, and why this matters in this article. I’d love for you to take a look, and if you spot one you love, tag a friend who would enjoy it too.KxOur 28 authors"
