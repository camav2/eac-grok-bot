                          - generic [ref=f35e1418]:
                            - generic [ref=f35e1421]:
                              - text: 7 months ago,
                              - link "Benita Bensch" [ref=f35e1423] [cursor=pointer]:
                                - /url: /in/benitabensch/
                              - text: pitched her book idea to a small Zoom room of publishers and publishing professionals. Like the 35 other authors there that day, she was nervous as hell.Today, her book landed in my hands.I think about that experience a lot because nothing about it was luck, and it definitely wasn’t about landing a book deal or which way she ended up publishing.The real value was everything that came before it.Completing the book proposal process that turned a half-formed idea into something structured. The community of fellow writers who provided feedback, challenged it, sharpened it, and asked the hard questions along the way. The courage it took to say the idea out loud to others before she even believed in it herself.That's the part that's meaningful and carries weight.
                              - link "Graeme Cowan" [ref=f35e1425] [cursor=pointer]:
                                - /url: /in/graemecowan1/
                              - text: ","
                              - link "Penelope Barr" [ref=f35e1427] [cursor=pointer]:
                                - /url: /in/penelopebarr/
                              - link "Andrew Sloan" [ref=f35e1429] [cursor=pointer]:
                                - /url: /in/andrewwilliamsloan/
                              - text: ","
                              - link "Sophie Bretag" [ref=f35e1431] [cursor=pointer]:
                                - /url: /in/sophiebretag/
                              - text: ","
                              - link "Sarah Gray GAICD" [ref=f35e1433] [cursor=pointer]:
                                - /url: /in/sarah-gray-gaicd/
                              - link "Bee Lim, Ph.D." [ref=f35e1435] [cursor=pointer]:
                                - /url: /in/drbeelim/
                              - text: all had different ideas and different books, but the same room, process and same willingness to bring something half-formed and let it be pulled into shape.An idea shared early, with the right humans, can be pressure-tested before it's anywhere near ready, and pulled into shape long before you'd ever trust it alone.That's the conversation I want more writers having. Not with a blank page, or with Claude but with people who ask the questions you've been avoiding.What's the idea you've been sitting on, the one you haven't said out loud just yet?Kx****HI I’m Kelly, founder of the
                              - link "Expert Author Community" [ref=f35e1436] [cursor=pointer]:
                                - /url: https://www.linkedin.com/company/expert-author-community/
                              - text: ", where we’ve helped 317+ alumni and authors.Intake 5 is open for early enrolment. Enrol by 30 June to lock in current pricing and step into a stronger intake."
