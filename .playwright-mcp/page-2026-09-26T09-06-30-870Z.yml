                      - text: "at 43,000 Feet and the man who built one of aviation’s first pilot wellness programs, didn’t wait for the last flight to figure out who he was outside the cockpit.In this episode, we get into:→ The moment he realized he’d taken on too much and asked to step back.→ The pushback he got building mental health programs across five countries.→ Why he took eight months of leave before his final flight, just to be sure.→ The landing that mattered more than any other in his career-> with his daughter in the right seat.This isn’t a story about walking away from a career. It’s a story about building the next one before you need it.Full episode live here:"
