                    - paragraph [ref=f66e2181]:
                      - generic [ref=f66e2182]:
                        - text: PLEASE DON'T EAT YOUR GREGGS IN STARBUCKS😂I don't like being told what I should and shouldn't do. I like to feel like I have choice and the decision is mine.Very Big Unsausaging Energy.But I'm actually a bit of a goody two shoes about some things.For example, when Paul and I first got together he bought Greggs for lunch and I was mortified when he and his daughter proceeded to eat it inside Starbucks, where I'd only bought one coffee. I can still remember how uncomfortable it made me feel. 😂I've never been one for breaking rules if they make sense to me. Some rules make things fairer (fairness is very high up my values list) or easier. For many years I mostly talked about the whole rules thing around clothes.I've always thought “age appropriate” dressing was bollocks, but I didn't think every piece of style advice should automatically be lobbed in the bin either.Understanding WHY something is recommended (eg colour or shape wise) can be useful because then you get to choose and make an informed decision.These days my work has wandered beyond clothes and I like poking other stuff with a stick too.The rules we've absorbed about getting older, work, success, visibility and what we're supposed to want.I'm never going to lead a FUCK THE RULES rebellion but i am very interested in noticing the rule and deciding whether I actually agree with it.Because to me blindly doing the opposite of what you're told isn't really any more of a choice than blindly doing what you're told.Spot. Split. Sizzle. Would you eat a Greggs in Starbucks?
