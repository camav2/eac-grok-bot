                  - paragraph [ref=f33e1292]:
                    - generic [ref=f33e1293]:
                      - text: "One of the best ways to get more from a book is to spend a few minutes with the book closed.Here are three simple practices that can help you get more out of every book.(1) Test yourself.Psychologists Henry Roediger and Jeffrey Karpicke asked students to study short passages, then either reread them or practice recalling what they’d read. A week later, students who practiced recall remembered 56% of the material. Those who reread remembered 42%.After a chapter, close the book. Write down what you remember. Then open it and see what you missed. The effort of retrieving an idea helps it stick.(2) Ask three questions.What’s the big idea?How does the author know?What should I do with it?Give yourself ten minutes. Put the answers in your own words. You’ll have a better grasp of the argument, its evidence, and its possible place in your life.(3) One book, one action.If a book gives you an idea worth trying, pick one small way to put it into practice this week. Change how you open a meeting. Ask a better question. Make time for something you keep postponing.See what happens. Adjust.Keep asking, “What should I read next?” It’s a wonderful question. Add another: “What could I try from what I just read?”"
