                        - generic [ref=f33e1822]:
                          - text: When work feels overwhelming, our instinct is often to add something.Perhaps another system, or hold another meeting, or … shall we introduce another productivity tool? And that’s yet another item on the ever increasing list. However what if the better question is, “
                          - strong [ref=f33e1823]: What can I remove?”
                          - text: In my latest episode of Your Career Podcast (epf285), I speak with productivity expert and bestselling author,
                          - link "View Donna McGeorge’s profile" [ref=f33e1825]:
                            - /url: https://www.linkedin.com/in/donnamcgeorge/
                            - strong [ref=f33e1826]:
                              - strong [ref=f33e1827]: Donna McGeorge
                          - text: ", about her book, Red Brick Thinking, and the value of strategic subtraction. Donna explains that many productivity problems are not about poor time management but are often the result of overcommitment, unclear priorities, excessive meetings and difficulty delegating. We also discuss: · Why capable professionals continue saying yes when they are already stretched · How our beliefs about work, responsibility and perfectionism influence the way we use our time · Why clear boundaries are essential for protecting our attention and capacity · The importance of regularly reviewing what no longer belongs in our work or career This idea is particularly relevant for job seekers during a career transition. We often focus on what we need to add: new skills, more contacts, another qualification or a longer list of achievements when, to be honest, progress begins by stopping for a minute, and looking at what is THE most important thing and probably letting go of some of the things on that long ‘to do’ list. It could be an outdated expectation, a responsibility that no longer fits, a project that has reached the end of its useful life or, perhaps, the belief that we must do everything ourselves. Donna’s career story is equally fascinating, from her early ambition to become a coroner, (yes, that’s a big change from where she is today!) to building a highly successful career as an author, speaker and productivity specialist. Listen to our conversation on Your Career Podcast with Jane Jackson and consider:"
                          - strong [ref=f33e1828]: What might become possible if you stopped adding and started subtracting?
                          - strong [ref=f33e1829]: Share your productivity tips in the comments.
