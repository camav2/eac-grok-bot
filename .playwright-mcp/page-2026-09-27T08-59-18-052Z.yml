                          - generic [ref=f65e781]: "Productivity is a leadership practice. Is this a hot take?Productivity is too often handed down as an individual responsibility, as though people should manage themselves brilliantly inside systems that are overloaded, unclear and constantly interrupted. Then everyone acts surprised when capacity is stretched to breaking point.Productivity is shaped by leaders. They decide what gets attention, what feels urgent, and whether people ever get room to think. In a lot of workplaces, the problem is leadership settings that reward responsiveness over reflection, availability over judgement, motion over progress.A productive leader does more than drive output. They create the conditions for better thinking, protect focus where it matters, and treat strategic subtraction as part of the job. Every unnecessary demand placed on a team costs something well beyond time. Quality, energy, decision-making and leadership depth all take a hit.If senior leaders want more sustainable performance, they need to look past personal productivity tools and examine the leadership environment itself. What are we normalising? What are we interrupting too often? What's still sitting on the agenda that stopped earning its place months ago?The future of productivity will be built on leading with more clarity, more discernment, and more room to breathe.**********Hi, I'm Donna McGeorge, based in Geelong, and I've spent decades helping leaders and teams get to the heart of what actually makes work productive. These days that means rethinking productivity altogether: the real issue in most organisations isn't a shortage of hacks, it's a shortage of trust, clarity, and good decision-making, and that's the conversation I bring into every room I work in.If you'd like to be part of that conversation, here's where to start:* Subscribe to my newsletter here on LinkedIn via my profile* Message me about in-house training and keynote speaking"
