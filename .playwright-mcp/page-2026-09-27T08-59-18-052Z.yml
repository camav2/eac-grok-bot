                        - generic [ref=f65e675]:
                          - generic [ref=f65e676]: "I've been in the speaking, training, and facilitating game for a long time, and the patterns I'm noticing lately are becoming obvious. I get asked to deliver something on productivity, and it turns out the productivity problems aren't productivity problems.They're trust problems for example, a leader wants to be over everything and in every meeting because they don't trust people to get on with the work unless they can see it happening.Or they're clarity problems with everyone flat out doing stuff no one has said what actually matters this week.Or they're about a decision sitting with the wrong person, and stuck in an endless cycle of meetings.None of that gets fixed with a better calendar or a new productivity hack. It gets fixed when a leader looks at their own habits and works out what needs to stop.That's the basis of the Productive Leaders Program. Send me a message and we'll talk it through.**********Hi, I'm Donna McGeorge, based in Geelong, and I've spent decades helping leaders and teams get to the heart of what actually makes work productive. These days that means rethinking productivity altogether: the real issue in most organisations isn't a shortage of hacks, it's a shortage of trust, clarity, and good decision-making, and that's the conversation I bring into every room I work in.If you'd like to be part of that conversation, here's where to start:* Subscribe to my newsletter here on LinkedIn via my profile* Message me about in-house training and keynote speaking"
