                          - generic [ref=f65e1543]: "There's a whole category of work that never makes it onto a project plan, a Gantt chart, or a KPI, and sometimes it doesn't even make it onto your to-do list, yet it swallows hours of your day and leaves you wrecked by five o'clock with nothing to show for it.I call it shadow work, and once you start looking for it, you'll see it everywhere: the meeting that spins off into three follow-up chats nobody scheduled, or the mental load of holding a dozen things you haven't written down anywhere.For years, I assumed being flat out all day and still somehow behind was just bad planning, but I've come to realise it's something else entirely: a whole layer of invisible work that rarely gets noticed or recorded.Comment SHADOW below, and I'll send you the little tool I created for a client who wanted to help their people get on top of this.**********Hi, I'm Donna McGeorge, based in Geelong, and I've spent decades helping leaders and teams get to the heart of what actually makes work productive. These days that means rethinking productivity altogether: the real issue in most organisations isn't a shortage of hacks, it's a shortage of trust, clarity, and good decision-making, and that's the conversation I bring into every room I work in.If you'd like to be part of that conversation, here's where to start:* Subscribe to my newsletter here on LinkedIn via my profile* Message me about in-house training and keynote speaking"
