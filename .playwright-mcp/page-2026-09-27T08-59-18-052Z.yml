                        - generic [ref=f65e2307]:
                          - generic [ref=f65e2308]: "The productivity conversation is changing. People are less interested in hacks and have less patience for performative busyness. They are more hungry for a serious discussion about how work actually happens.I reckon that shift is overdue.The conversations I'm having with leaders and conference audiences right now sit inside a wider, more commercial lens on productivity: how trust affects output, how clarity affects pace, how decision-making affects momentum, how leadership affects capacity.Organisations need sharper thinking, a stronger point of view, and practical ways to cut the drag that keeps capable people stuck in patterns that were never working for them.That's the conversation I bring into keynotes, leadership offsites and workshops. A genuinely different discussion for organisations dealing with complexity and competing priorities, not a recycled time management talk.If you're planning a conference or shaping next year's development agenda, this is a conversation that tends to stay with people after they've left the room. When leaders rethink productivity, they rethink how work gets led and that changes culture, capacity, and the quality of thinking at work.If that's the conversation your audience is ready for, I'd be glad to be part of it.**********Hi, I'm Donna McGeorge, based in Geelong, and I've spent decades helping leaders and teams get to the heart of what actually makes work productive. These days that means rethinking productivity altogether: the real issue in most organisations isn't a shortage of hacks, it's a shortage of trust, clarity, and good decision-making, and that's the conversation I bring into every room I work in.If you'd like to be part of that conversation, here's where to start:* Subscribe to my newsletter here on LinkedIn via my profile* Message me about in-house training and keynote speaking"
