                  - paragraph [ref=f46e2203]:
                    - generic [ref=f46e2204]:
                      - text: We're officially walking the talk.If you've been paying close attention over the past few weeks, you may have noticed things looking a little different around here. A new color here. A slightly different look there. Little hints that something was quietly coming together behind the scenes.🤫Today it's finally ready to share.We're introducing a completely refreshed
                      - 'link "View company: Smith Publicity, Inc." [ref=f46e2206] [cursor=pointer]':
                        - /url: https://www.linkedin.com/company/smith-publicity/
                        - strong [ref=f46e2207]: Smith Publicity, Inc.
                      - text: "A new website, a new visual identity, a new logo, and something I'm perhaps even more excited about: New language that better reflects the work we've already been doing for years.Because while Smith will always be deeply rooted in books and book publicity, our work has never really stopped at the book.We're helping authors think about the expertise behind it. The platform they're building around it. The media relationships, thought leadership, speaking opportunities, and visibility that can continue long after launch day has passed.We've been talking about Smith this way internally for a while. You've probably even heard me talking about it here. Now our website actually reflects it.And THAT feels exciting.Of course, we wanted the way Smith looks to evolve right alongside the way we're talking about our work. But figuring out how to do that without losing the things people already love about us was probably the hardest part.Over the years, we've heard the Smith brand described as warm, human, approachable, authentic. Those aren't words you want to accidentally redesign away. So every decision kept coming back to the same question:Can this feel more elevated without feeling less like us?I really think we got there.It feels cleaner, sharper, and much more reflective of who Smith is today. But the heart of it hasn't changed. We're still the same people who get ridiculously excited when we see a client's book out in the wild, celebrate every great media win, and care very deeply about the people who trust us with their work.We're just telling the full story now.(And after nearly three decades in business, calling this Smith Publicity 2.0 feels generous. It's probably closer to 10.0 at this point. 😄)We'd love for you to take a look around and tell me what you think.And for those of you who've known Smith for a long time, I'm especially curious:Does it still feel like us?"
