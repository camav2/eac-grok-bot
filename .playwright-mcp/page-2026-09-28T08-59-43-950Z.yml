                    - generic [ref=f46e1761]:
                      - text: A very special milestone for Soulful Simplicity.I’m delighted to share that The Herald Sun has published a two-page feature on the book, including an extract from my story and the ideas that sit at the heart of Soulful Simplicity.The article is online now and will appear in print tomorrow.As an author, there is something quite extraordinary about seeing words that began privately, through reflection, lived experience and years of professional work, reach a much wider audience.Soulful Simplicity explores what happens when we stop trying to become more and begin reclaiming the parts of ourselves we may have lost through responsibility, adaptation, relationships and the demands of life.I’m incredibly grateful to see this conversation continuing beyond the pages of the book.
