                    - generic [ref=f46e2563]:
                      - text: 🏵 Last week, I was lucky enough to join an info panel for
                      - 'link "View company: The Community Collective" [ref=f46e2565] [cursor=pointer]':
                        - /url: https://www.linkedin.com/company/the-community-collective/
                        - strong [ref=f46e2566]: The Community Collective
                      - text: "’s newest cohort, Cohort #9, which kicked off last week (& fwiw, is already off to an amazing start).It was particularly meaningful to be part of the conversation because I’m now going through my 6th cohort with The CC, and my 4th of them as an Ambassador.One of the questions I was asked was: What keeps bringing you back?The short answer: the people (so many of you know who you are 🧡).The more interesting answer: I’m never bringing the same version of myself into the room.As my career evolves, so do the questions I’m asking, the challenges I’m navigating, and the perspective I can contribute.I’ve built genuine friendships through"
                      - 'link "View company: The Community Collective" [ref=f46e2569] [cursor=pointer]':
                        - /url: https://www.linkedin.com/company/the-community-collective/
                        - strong [ref=f46e2570]: The Community Collective
                      - text: ", expanded my network, and had career opportunities come directly from the community.But the biggest value has been the compounding effect of staying connected to smart, generous people who inspire & challenge how I think.I think that’s something we underestimate about growth, it doesn’t always come from finding the next thing.Sometimes it comes from returning to the right room, with more experience, better questions, and more to give.That’s why I keep coming back. 🧡"
