                        - strong [ref=f46e1303]: Michelle Broadbent
                      - text: in Manly, and learned about her amazing fashion label. It's part of the 3% Club - yes that's right, just 3% of the clothing we buy in Australia is actually made here, and Philosophy Australia is proudly part of this very exclusive club. Hearing from Ali about her passion for fashion, her commitment to slow, sustainable and ethical clothing and her belief in the power of small business, I was hooked on her story. When we did some PR work together later in the year, I had a story of my own to share... I'd gone into my own wardrobe and discovered I already owned a Philosophy Australia top! I'd actually purchased it from a local op shop, a beautiful white blouse that was still in perfect condition - a testament to the durability and craftsmanship that goes into every piece of Philosophy clothing.I showed Ali the top and she explained it was from a collection from a few years ago - but of course, still good as new. Which brings us to January 2026, when Ali told me she'd decided to bring a version of that same top back into the newest collection, and to name it after me! Then a few weeks ago I saw Ali at this year's Accountability Circle Conference and she presented me with my very own 'Huckle' top. Isn't it pretty? It's available now and already a bestseller!
