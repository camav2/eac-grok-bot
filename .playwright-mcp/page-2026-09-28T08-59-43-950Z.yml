                          - text: What's your favorite restaurant?It works especially well across cultures because everyone has an opinion about food, it is not too private for someone you do not know well yet, and the answer is a good way to continue the discussion (which type of food, any specific memory linked to this place...)I've used it in all countries I have travelled to and lived in, and it opens doors faster than almost any "getting to know you" question I've tried.Plus it is an excellent way to build a list of go-to food places in any city in the world!
