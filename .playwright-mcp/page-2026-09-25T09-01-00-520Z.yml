                      - generic [ref=e2129]:
                        - text: Some books can't be squeezed onto a standard publishing shelf. Especially when they're a mix of magical realism, mind and art. So what do you do when you have a very specific vision and handing over creative control doesn't feel right? Clinical psychologist
                        - link [ref=e2130]:
                          - /url: /in/drbeelim/
                          - text: Bee Lim, Ph.D.
                        - text: answered that question with custom publishing, and she shares her reasoning in my latest conversation for the Self-Publishing with
                        - link [ref=e2131]:
                          - /url: https://www.linkedin.com/company/the-alliance-of-independent-authors/
                          - generic [ref=e2132]: Alliance of Independent Authors (ALLi)
                        - text: "Podcast (link in comments). Her book, 'Welcome Home: Healing Trauma & Reclaiming Wholeness', is an illustrated narrative non-fiction hardcover, a reflective story rather than a self-help manual, born from noticing her clients connected with mental health concepts better through narrative and metaphor than clinical explanation. Amongst other things we talk about: → Custom publishing: keeping IP and creative control while relying on an established publisher's production and distribution experience → Endorsements: the email Bee almost didn't send to an Ivy League professor, and the connection it sparked → Writing and marketing as a regulated health professional: unsolicited reviews only, client confidentiality first, and positioning the book as a resource, never a treatment → Translation rights: Chinese rights being pitched currently, another area where indie authors have agency I first met Bee at"
                        - link [ref=e2133]:
                          - /url: /in/kelly-irving/
                          - text: Kelly Irving
                        - text: "'s"
                        - link [ref=e2134]:
                          - /url: https://www.linkedin.com/company/expert-author-community/
                          - generic [ref=e2135]: Expert Author Community
                        - text: on the fabulous pitch day, where authors pitch their concepts to publishers and industry professionals. Watching Bee take that concept all the way to a beautifully produced book has been a privilege. It's great timing too because if you're a health and medical professional, I'm co-hosting a live workshop with healthcare thought leadership strategist
                        - link [ref=e2136]:
                          - /url: /in/meganwalkerthoughtleadership/
                          - text: Megan Walker
                        - text: on Friday 11 September, ‘How to Write and Publish a HealthCare Book’. If that's of interest, see you there. Links in the comments.
