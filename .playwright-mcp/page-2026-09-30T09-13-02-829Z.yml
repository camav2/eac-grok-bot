                      - text: Someone asked me today who my ideal copywriting clients are.And the truth is, I think these days I’m a BOOTY CALL COPYWRITER.(Thanks @nerissabentley for absolutely nailing this description.)I love being the copywriter you call when you need to feel good and get shit done.I may not be around for a long time (retainers aren’t really my thing), but I’m definitely here for a good time.At the moment, I’m particularly enjoying helping clients:1. Develop their brand voice, positioning, values and personality.2. Get their website recommended by ChatGPT and other AI tools by strengthening their EEAT signals and making it easier for AI to understand why they’re worth recommending.3. Improve usability, accessibility and conversion so their websites work harder and help turn more visitors into customers.4. Write standout, contrary, funny, thought-provoking social content that actually makes people stop scrolling.So, if you want someone to wade through your annual report, lose my number.But if you want someone to fix things, improve things and help you win more customers?Put me on speed dial 📞
