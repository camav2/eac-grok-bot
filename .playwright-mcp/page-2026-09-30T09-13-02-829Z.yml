                      - text: I love the Ted Lasso series, and also find it challenging. Especially when it seemed like we all ignored that Ted was suppressing a lot of emotions and expecting vulnerability without leading with vulnerability in the first couple of seasons. Fast forward to season 4 and 'Dr Sharon Fieldstone' who shares something that really landed for me in a podcast on her book about the team:"Cliques are just a way to find a community in a stressful environment. ..... to deal with cliques you create a space where the factions can interact ....." She talked about how teams naturally fracture into "protective silos" when they face high pressure but lack deep, foundational trust.And these silos lead to passive-aggressive behaviour and an ultimate "loss of the dressing room". Haven't we all seen that play out. The fastest I've seen teams develop trust is in some of the workshops I facilitate with a card game, ECD.And it blows my mind every time. The key though is in the follow up.Continuing the conversations, using the output, and ideally but not necessarily the cards as well. There's so much more we can do to 'win the dressing room'.
