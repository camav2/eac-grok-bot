                  - paragraph [ref=f43e300]:
                    - generic [ref=f43e301]:
                      - text: "You want more speaking opportunities.So you start researching conferences.Reaching out to associations.Making a list of corporate events.But before you send a single pitch, I want you to look at something else:What happens when they Google you?Because getting in front of the right opportunity is only half the equation.The person on the other side still needs to be able to quickly understand:What do you speak about?Why are you the person to speak about it?And what will their audience walk away with?That's where your speaker assets come in.That typically means:→ A website and speaking page with clear positioning→ A social media profile that reinforces that same expertise→ A speaker sizzle sheet→ A speaker summary with approved, easy-to-use copy→ A video that shows how you communicate your ideasAnd no, you don't necessarily need a beautifully produced highlight reel from a massive stage to get started.If you don't have stage footage yet, a thoughtful 90-second video of you speaking directly to camera can still give someone a sense of your ideas, perspective, and presence.The goal isn't to have more assets.It's to make the decision easier for the person considering you.When your website says one thing, your LinkedIn says another, and your speaker materials introduce a third version of you, you're making that person do the work of figuring out where you fit.Your assets should do that work for them.Before you ask, “Where should I be speaking?” ask: “Am I making it easy for someone to book me?”If you have any questions about these assets, their role in building your speaking presence, or anything else related to the ever-changing and always-growing speaking space, I’d love to connect. We’re actively expanding the services and guidance we provide around this top goal shared by many of our authors."
