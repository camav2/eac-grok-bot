                        - generic [ref=f139e223]: ✈️ Bringing Aviation Safety Management to Life Through Industry ExpertiseOne of the most rewarding aspects of teaching within
                      - 'link "View company: UniSQ Aviation | School of Business, Law, Humanities and Pathways (BLHP)" [ref=f139e224] [cursor=pointer]':
                        - /url: https://www.linkedin.com/company/unisq-aviation/
                        - strong [ref=f139e225]: UniSQ Aviation | School of Business, Law, Humanities and Pathways (BLHP)
                      - text: is creating opportunities for students to learn not only from academic content, but also from professionals who apply those principles every day in operational aviation environments.As Course Coordinator and Lecturer for AVN3102 Advanced Aviation Safety Management Systems, I was pleased to provide UniSQ Aviation students with the opportunity to engage directly with highly experienced aviation professionals who shared real-world perspectives on safety leadership, operational decision-making, regulatory compliance and contemporary aviation practices.Students had the opportunity to learn from:✈️
                      - link "View Chris Smith’s profile" [ref=f139e227] [cursor=pointer]:
                        - /url: https://www.linkedin.com/in/chris-g-smith/
                        - strong [ref=f139e228]: Chris Smith
                      - text: ", former Jetstar Captain, who shared insights from airline flight operations and demonstrated how ICAO competencies contribute to safe decision-making, teamwork and operational performance.✈️ Greg Kemp, Safety Manager and Grade 1 Flight Instructor at Air Gold Coast, who explored the practical implementation of Safety Management Systems, ICAO Annex 19 requirements and contemporary safety culture within flight training organisations.✈️ Captain"
                      - link "View Gavin Haslemore’s profile" [ref=f139e230] [cursor=pointer]:
                        - /url: https://www.linkedin.com/in/gavin-haslemore/
                        - strong [ref=f139e231]: Gavin Haslemore
                      - text: ", Director of Flight Operations at Air Hong Kong and former Chief Pilot (Airbus and Boeing) at Cathay Pacific, who provided valuable insights into Just Culture, airline safety leadership and organisational learning.✈️"
                      - link "View Chanika Mannawaduge’s profile" [ref=f139e233] [cursor=pointer]:
                        - /url: https://www.linkedin.com/in/chanika-mannawaduge-ab379232/
                        - strong [ref=f139e234]: Chanika Mannawaduge
                      - text: ", former aviation regulator and current researcher specialising in Fatigue Risk Management, who demonstrated how fatigue risk management and Safety Management Systems are applied to manage operational risk across the aviation sector.These sessions enabled students attending both in-person and online to connect theoretical concepts with contemporary aviation practice while learning from professionals who have led safety, training and operational functions across airlines, regulatory bodies and flight training organisations.A sincere thank you to all our guest speakers for investing their time and expertise in supporting UniSQ Aviation students and helping develop the next generation of aviation professionals. Industry engagement remains one of the most effective ways to bridge the gap between classroom learning and professional practice.Which aviation professional, mentor or industry leader has had the greatest influence on your career journey?"
