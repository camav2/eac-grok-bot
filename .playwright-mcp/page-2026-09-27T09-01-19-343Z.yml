                        - generic [ref=f93e781]:
                          - generic [ref=f93e782]: A funny thing happened after I wrote my book, suddenly I became very popular with all kinds of people such as those:- kindly wanting to review my book - for an exorbitant fee- generously offering to share my book with their newsletter groups or communities - for an extraordinarily large fee- creative suggestions about turning my book into a movie. Exciting, you guessed it, very expensive and very few details on value or distribution- you get the picture. Lots of offers, so little value. I'm all for people finding creative ways to make $ but these have all been weird and scammy.So, new authors beware. There are a lot of 'offers' out there. Most of them questionable.
