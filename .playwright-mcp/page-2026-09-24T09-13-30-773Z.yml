                          - generic [ref=f46e341]:
                            - text: Facilitation has always been close to my heart.As a practice, it’s inclusive, supportive and empowering – all qualities that I value greatly.That’s why I put my hand up to help organise this amazing event, along with talented people like
                            - link "Michelle Howard" [ref=f46e343] [cursor=pointer]:
                              - /url: /in/michelle-howard-7808b236/
                            - text: and
                            - link "Noel Gately" [ref=f46e345] [cursor=pointer]:
                              - /url: /in/noel-gately-56921268/
                            - text: – fellow lifelong facilitators.It’s been really rewarding seeing the program come together over the past few months.I’ve been happy to play my part working with the amazing
                            - link "Teagan Malcolm" [ref=f46e347] [cursor=pointer]:
                              - /url: /in/teagan-malcolm-5356b0266/
                            - text: "to create a distinctive design to help spread the word far and wide about this amazing event that is a warm up to the much-anticipated IAF Oceania Conference in Geelong that kicks off from 14 October.So, if you’re a FODW regular – you know you’re in for a treat!If you’re new to FODW, let me share a little bit about what you can expect from the day.Quality content. Interactive learning experiences. A distinctive regional flavour.Sessions showcasing an array of skills that make facilitation a core capability in whatever organisation you’re working in.Make the time to invest in you. Take a day out of your regular routine and head to Geelong.You will leave energised and inspired to create positive impact.So you know what you need to do...Head to our website to buy your tickets today:"
