                          - generic [ref=f46e629]:
                            - text: I love wearing different hats in the work I do.Last week’s gathering of
                            - link "Adairs Retail Group" [ref=f46e630] [cursor=pointer]:
                              - /url: https://www.linkedin.com/company/adairs-retail-group/
                            - text: hosting retail leaders from around the country at the MCG was BIG!It was an important test for the major change initiative I’m leading because we were bringing it to life.Making it real, talking up how it would make a difference for customers and retail teams and most importantly, giving everyone a chance to get some hands on practice with the new system.We also took the opportunity to share perspectives on the practicalities of change – normalising and validating the challenges people can expect to experience.I got to support senior leaders to share these insights; work with SMEs to provide practical demos, join a panel discussion on leading change and partner with the GM of Retail
                            - link "Kate Ryan" [ref=f46e634] [cursor=pointer]:
                              - /url: /in/kateryan82/
                            - text: to close it out. This is my favourite photo that sums up the experience.Look closely. What do you notice?Focused attention.As we wrapped up three days of content, conversation and demonstration, I asked the group two questions:👉 What’s going to help you get ready for Go Live?👉 What do you need to do in the next four weeks?The room was silent.Even though people were tired, they stepped into the space of reflection.Taking personal accountability. Embedding learning. Prioritising practical action.When I asked each person to share one action I was blown away.What I heard was clarity, courage and conviction.Everyone in the room knew what they needed to do to set themselves and their teams up for success back in store.🙌 This is change leadership in action.
