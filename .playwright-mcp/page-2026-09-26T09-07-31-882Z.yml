                                    - generic [ref=f169e2156]:
                                      - text: 𝐖𝐡𝐚𝐭 𝐝𝐨𝐞𝐬 𝐚 𝐜𝐚𝐫𝐞𝐞𝐫 𝐢𝐧 𝐩𝐫𝐨𝐟𝐞𝐬𝐬𝐢𝐨𝐧𝐚𝐥 𝐬𝐞𝐫𝐯𝐢𝐜𝐞𝐬 𝐛𝐫𝐢𝐧𝐠 𝐭𝐨 𝐄𝐱𝐞𝐜𝐮𝐭𝐢𝐯𝐞 𝐂𝐨𝐚𝐜𝐡𝐢𝐧𝐠?For those who work in the industry, I think it brings tremendous value. Having spent more than 30 years in professional services, I understand many of the issues that can find their way into coaching conversations.I’m sure some of these will sound familiar.It may start with your career progression across different roles, service lines and Executive Teams.Then there’s imposter syndrome! Waiting to be found out or wondering whether you really deserve the role you’ve worked so hard to achieve.There may be self-limiting stories which reduce your confidence and impact, alongside the challenge of juggling responsibilities at work and home whilst finding the time and energy to be your best or better self.Yet coaching isn’t only about challenges. It can also be about how you continue to stretch yourself, be of greater service to your clients and bring your experience and thinking to increasingly complex problems and systems.You may be thinking about your identity and finding greater meaning and purpose in your role. You may be working hard to have a positive leadership impact.At the same time, you’re running a business. There are KPIs and metrics to navigate, stakeholders and client relationships to manage, and high-performing teams to build where people feel valued, have opportunities to learn and grow, feel psychologically safe and remain engaged.These are just some of the conversations that come into my coaching room.Having spent 24 years as a Deloitte Partner, and over a decade as a Certified Executive Coach in professional services, I understand the pace, expectations, metrics, politics and client demands that sit behind them.We don’t need to spend valuable coaching time explaining the context. We can get to the conversation that matters.My role isn’t to tell you how I navigated professional services. It is to help you think more deeply about how you want to navigate it, the choices available to you and the leader you want to be.If some of this sounds familiar, perhaps it’s time for a coaching conversation.Send me a DM or email
                                      - link "Open mailto:karensteincoaching@gmail.com" [ref=f169e2159]:
                                        - /url: mailto:karensteincoaching@gmail.com
                                        - strong [ref=f169e2160]: karensteincoaching@gmail.com
                                      - text: to discuss what coaching might look like for you.
