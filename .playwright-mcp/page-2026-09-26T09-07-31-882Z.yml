                                      - text: I did 2 things yesterday which showed me my world is in sync.I redecorated my office. I hung a few posters of things which inspire me. One is the self talk I always use “You got this”. It steadies me when I feel less than. It replaces any negative thoughts which might distract me. It’s been used on ski slopes and during keynote presentations. It works for me.The second thing I did was empty my mail box. In it I found a glorious letter addressed to me. The handwriting was familiar and the pink paper brought a smile.This letter was full of encouraging and motivating thoughts and ended with the same few words “You’ve got this”.This letter reminded me of how far I’ve come and where I am going.It reminded me that I can do this.It reinforced my self-belief and my love of what I do in support of others.This letter reminded me of the wonderful 2 days I spent with the incredible
                                      - link "View Janine Garner’s profile" [ref=f169e2068]:
                                        - /url: https://www.linkedin.com/in/janinegarner/
                                        - strong [ref=f169e2069]: Janine Garner
                                      - text: and her awesome Elevate community in June discussing our businesses. We wrote a letter to ourselves and left it with Janine. She mailed them to us some 2 months later.Mine arrived yesterday. My pink papered letter to me from me. It warmed my heart and filled me with hope and optimism.I’ve completed this exercise on other occasions yet it hasn’t had the positive impact it did this time. Perhaps my understanding of me has developed and allowed the letter to be so much more on point.The words “you’ve got this” and its matching with my poster could be a sign! Thanks
                                      - link "View Janine Garner’s profile" [ref=f169e2071]:
                                        - /url: https://www.linkedin.com/in/janinegarner/
                                        - strong [ref=f169e2072]: Janine Garner
                                      - text: for guiding us through this exercise - it was so worthwhile and you are so appreciated 💗
