                                      - text: Did you realise that I have 2 newsletters? 📃 📜 1. The first is called 𝐌.𝐀.𝐃. 𝐚𝐛𝐨𝐮𝐭 𝐌𝐞𝐧𝐨𝐩𝐚𝐮𝐬𝐞™️(𝐦𝐚𝐤𝐢𝐧𝐠 𝐚 𝐝𝐢𝐟𝐟𝐞𝐫𝐞𝐧𝐜𝐞 𝐚𝐭 𝐰𝐨𝐫𝐤). It offers inclusive, practical insights on managing menopause in the workplace.2. The second is 𝐓𝐡𝐞 𝐌𝐢𝐝𝐥𝐢𝐟𝐞 𝐋𝐞𝐚𝐝𝐞𝐫𝐬𝐡𝐢𝐩 𝐒𝐞𝐫𝐢𝐞𝐬. A newsletter for leaders navigating midlife. Where capability is high, but how you lead and why begins to matter more.I'm sure there's a smarter way to share the links! A fancy button with a direct link would do the trick, however I haven't worked out how to add that to a post!If you'd like to subscribe, I've put the direct links in the comments below. I'd love to hear your reflections. 💛 Each newsletter comes out monthly.Look out for the next edition of M.A.D., coming out early October leading up to World Menopause Day.=========================================================
