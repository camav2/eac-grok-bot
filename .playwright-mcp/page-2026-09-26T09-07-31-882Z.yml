                                    - generic [ref=f169e1411]:
                                      - text: How exciting! 💛 I've always believed that sharing ideas is most valuable when it starts conversations, challenges our thinking and helps us see issues a little differently.My thanks to
                                      - 'link "View company: LinkedIn" [ref=f169e1413]':
                                        - /url: https://www.linkedin.com/company/linkedin/
                                        - strong [ref=f169e1414]: LinkedIn
                                      - text: for including me as a LinkedIn Top Voice!Over the past few years I've written increasingly about the areas which matter most deeply to me. This includes 🔹 leadership 🔹 coaching 🔹 midlife leadership 🔹 managing menopause at work and 🔹 how we continue to grow and contribute throughout our lives. All of this is wrapped in kindness in leadership, which goes a long way to bettering the experiences we have together. 💟 What I value most about LinkedIn are the conversations which follow and the connections which are formed. The comments, questions, different perspectives and sharing of experiences adds to our perspectives and helps us learn and grow.Thanks to those of you who read, comment, challenge and join the conversation.I'm also appreciative of the relationships which have been formed through my use of LinkedIn. I've met incredible leaders, coaches, thought leaders, and wonderful generous people who too are interested in making this world a better place. These relationships are with people I may otherwise not have met, and many of those connections have developed into valued professional relationships, collaborations and friendships.I'm very pleased to add LinkedIn Top Voice to my virtual backpack and look forward to continuing the conversation.I hope my two monthly newsletters continue to add to your thinking on being "𝐌.𝐀.𝐃" 𝐚𝐛𝐨𝐮𝐭 𝐦𝐞𝐧𝐨𝐩𝐚𝐮𝐬𝐞™️(𝐦𝐚𝐤𝐢𝐧𝐠 𝐚 𝐝𝐢𝐟𝐟𝐞𝐫𝐞𝐧𝐜𝐞 𝐚𝐭 𝐰𝐨𝐫𝐤), and support your midlife leadership through 𝐓𝐡𝐞 𝐌𝐢𝐝𝐥𝐢𝐟𝐞 𝐋𝐞𝐚𝐝𝐞𝐫𝐬𝐡𝐢𝐩 𝐒𝐞𝐫𝐢𝐞𝐬.
                                      - link "View Brendan Wong’s profile" [ref=f169e1416]:
                                        - /url: https://www.linkedin.com/in/brendancwong/
                                        - strong [ref=f169e1417]: Brendan Wong
                                      - link "View Misa Han’s profile" [ref=f169e1419]:
                                        - /url: https://www.linkedin.com/in/misahan/
                                        - strong [ref=f169e1420]: Misa Han
