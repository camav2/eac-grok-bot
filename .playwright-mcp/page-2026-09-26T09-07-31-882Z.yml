                                        - strong [ref=f169e1951]: www.hermindherhealth.com
                                      - text: Over 2 days we have examined Women’s mental health across the lifespan.Day 1 focussed on understanding the blind spots in women’s mental health.Day 2 examined reimagining women’s mental health care.At the conclusion of my keynote I was asked how men are involved in the panel conversations which I have within organisations. This is a very important issue to ponder.The topic of managing menopause at work is for all genders. The more everyone understands and is aware of its potential impact at work, the easier it is for it to be safely and readily supported. Having men be a part of the conversation is crucial as this is not a women only issue.Thanks to
