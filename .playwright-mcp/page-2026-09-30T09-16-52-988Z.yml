                        - generic [ref=f102e809]:
                          - generic [ref=f102e810]: 10,000 podcast downloads.When I launched It’s a Mindset just over two years ago, I had no idea where it would lead.What started as conversations about mindset, worth, wealth and wellbeing has become one of the most meaningful parts of my work - connecting me with incredible guests, listeners and opportunities I never could have predicted.There have now been more than 90 episodes and over 10,000 downloads across the podcast, and while the numbers are exciting, what matters most to me are the messages from listeners saying an episode helped them feel seen, rethink something, or make a meaningful change in their lives.Building a podcast has also reminded me that consistency matters more than perfection.One conversation at a time adds up.Grateful to every guest, listener and supporter who has been part of the journey so far. And if you haven’t tuned in yet, It’s a Mindset is available wherever you listen to podcasts.
