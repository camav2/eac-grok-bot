                                - text: I recently joined
                                - link "Emma Lagerlow" [ref=f102e388]:
                                  - /url: /in/emma-lagerlow-4a2849/
                                - text: "on the It’s a Mindset podcast to talk about why caring for our health has become so complicated, and why more information, more tracking and more things to do don’t always lead to better health.We spoke about:• Why Gen X women have become some of the wellness industry’s most overwhelmed consumers• How to identify the area of your health that needs your attention most• why one meaningful change can be more effective than trying to overhaul everything at once• When tracking can disconnect us from how we actually feel• The health foundations that still matter, even when they aren’t new or exciting• Why midlife can be an opportunity to become more intentional about our health and the way we want to liveThis conversation goes to the heart of why I wrote The Health Edit: looking after your health shouldn’t require you to make it your entire life.Thank you, Emma, for such a thoughtful and great conversation!Listen to the episode via the link in comments!"
