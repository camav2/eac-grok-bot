                                - text: “What do you do?”It’s a simple questionUntil it isn’tIt was such a pleasure to join It’s a Mindset Podcast with
                                - link "Emma Lagerlow" [ref=f102e958]:
                                  - /url: /in/emma-lagerlow-4a2849/
                                - text: We spoke about how to rebuild momentum after redundancy or burnoutIt can be easy in these moments to reach for what’s knownOr jump quickly to a solutionThe next roleThe next titleThe safe answerBut rather than rushing back in, it helps to pause and create some spaceSpace to notice what’s changingSpace to reconnect with what gives you energySpace to do more of what you love, and find your flow againNot so much a reinventionBut a returnTo who you are beyond the roles you’ve heldTake small stepsExperimentStay flexibleThis can be the most powerful phase of your careerAn opportunity to create a Third Chapter of life and work that is uniquely your ownOut now on your favourite podcast platforms. Link in comments.If that question has been feeling harder to answer lately, you’re not alone
