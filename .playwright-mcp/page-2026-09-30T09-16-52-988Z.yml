                          - generic [ref=f102e915]:
                            - text: This was such a meaningful conversation with
                            - link "Robyn Greaves" [ref=f102e917] [cursor=pointer]:
                              - /url: /in/careercoachsydney/
                            - text: "- and one that feels incredibly relevant right now.We often feel the pressure to move quickly when something shifts… to find the next role, the next answer, the next version of ourselves.But what if the most powerful thing we can do is pause?Not to reinvent - but to return.To reconnect with who we are beyond the roles we’ve held, and what truly gives us energy and meaning.This is something I see so often in my work, particularly in midlife - and it’s exactly why I’m so passionate about supporting people to consciously create their next chapter.If you’ve been asking yourself “what’s next?” lately, this conversation is for you. ✨🎧 Links to tune in are in the comments."
