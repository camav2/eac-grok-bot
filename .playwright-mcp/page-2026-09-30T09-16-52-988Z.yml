                            - generic [ref=f102e527]:
                              - generic [ref=f102e530]:
                                - text: A bad day is not a life sentence.I loved joining
                                - link "Emma Lagerlow" [ref=f102e532]:
                                  - /url: /in/emma-lagerlow-4a2849/
                                - text: "on It’s a Mindset to talk about what happens when a perfectly ordinary Bad Day starts gathering evidence against us. The alarm doesn’t go off. Someone says something a bit sharp. Your confidence takes a tiny hit. And suddenly your brain is writing a 12-part documentary called Everything Is Terrible And It Always Will Be.This is why I think it matters to catch Bad Days early. Not to deny them. Not to jolly ourselves out of them. Not to slap a gratitude sticker over the top.But to pause and ask: what is happening here, what do I need, and what is one small thing I can do next?Because Bad Days are inevitable. Staying stuck in them isn’t.Thanks, Emma Lagerlow, for such a generous conversation.Listen here:"
