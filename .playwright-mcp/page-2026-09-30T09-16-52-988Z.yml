                        - generic [ref=f102e490]:
                          - generic [ref=f102e493]:
                            - text: I absolutely loved this conversation with
                            - link "Gayle Smerdon, PhD" [ref=f102e495] [cursor=pointer]:
                              - /url: /in/gayle-smerdon/
                            - text: ". 🎙️It's one of those episodes that reminds us we're all human.As someone who's had a few bad days recently myself, Gayle's message really landed: a bad day doesn't have to become a bad life.Sometimes the most powerful thing we can do is pause, recognise what's happening, and ask ourselves, What's one small thing I need right now?If you've been having a tough week, I think you'll get a lot out of our conversation in Episode 98 of It's a Mindset: How Not to Turn a Bad Day Into a Bad Life.Thank you again, Gayle, for sharing your wisdom so generously. 💛🎧 Episode links in the comments."
