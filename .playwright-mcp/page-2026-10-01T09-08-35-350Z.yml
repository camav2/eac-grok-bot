                            - text: Such important work! Thank you for your continued pursuit. As a mother of 2 young adults with ADHD, one who's also an autist, I've been observing hypercuriosity up close for a couple of decades now. And I can see the gift that it is as well as the costs it imposes. As neurodivergence awareness increases, as well as the increase in the size of the neurodivergent population, the world of work needs to adapt accordingly. So thank you for helping to build the path.
