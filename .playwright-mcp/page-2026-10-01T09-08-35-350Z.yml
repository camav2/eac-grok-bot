                      - text: ".I’ve deliberately left my schedule wide open for the week because I’m coming with a very specific mission: I want to start bringing my work on the science and skills of happiness to the US on a much more regular basis.For those who don't know: despite my thick Aussie accent, I’m actually a dual US/Australian citizen. I was born in Orange County, just down the road from LA, and we’re currently finalising my Social Security setup—meaning working and delivering keynotes in the States is completely seamless from a logistics standpoint.Over the last 10 years in Australia, I’ve had the absolute privilege of speaking on stages for hundreds of organisations, corporate teams, and conferences, teaching evidence-based, practical skillsets for mental and emotional performance as well as higher wellbeing. Now, I’m ready to expand that impact into the US market.So, if you’re based in LA (or have great connections there), I’d love to connect while I'm in town:"
                      - strong [ref=f48e544]: "Speaking Bureaus, Event Agencies, & Talent Managers:"
                      - text: I’d love 20 minutes to grab a coffee, introduce myself, and share my Speaker Kit and keynote topics.
                      - strong [ref=f48e545]: "Corporate Leaders & Event Organisers:"
                      - text: If you’re looking for a refreshing, high-impact keynote on workplace wellbeing, burnout prevention, or psychological resilience, let's chat.
                      - strong [ref=f48e546]: "Good people doing good work:"
                      - text: If you know someone in the personal development, human performance, or event space who I should know, I’d be immensely grateful for an introduction.If you know someone in LA who fits the bill (or if you are that person) drop a comment below or send me a direct message.Coffee is on me (I'll even include a Tim Tam to go with your coffee - an Australian delicacy). See you soon, LA!
