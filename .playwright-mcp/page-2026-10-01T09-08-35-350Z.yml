                  - paragraph [ref=f48e2458]:
                    - generic [ref=f48e2459]:
                      - text: "I helped start R U OK? We need 2 more questions.Thirteen years ago I helped Gavin Larkin build something that got Australians asking each other one question: are you okay?It worked. Not because it was clever. Because it asked something anyone could actually do.Lately I've been thinking about the people running our teams, and how much we ask of them without ever teaching them the habit we gave the rest of the country.So I've been testing something. Not a program. Three questions, asked in order, most days:- Am I OK? - Are we OK? - R U OK?Most workplaces only ever ask the third one, and only after something's already gone wrong.One leader I worked with had an engagement score of 84%, well above benchmark. By every measure, his team was winning. But something in the room had changed, so he asked all three questions anyway, and found seven people quietly struggling underneath a number that looked fine.90 days later, his meetings sounded different. People had stopped saying \"I\" and started saying \"we.\"I've written up what he did, and why I think workplaces need this movement more than another wellness policy.Thanks"
