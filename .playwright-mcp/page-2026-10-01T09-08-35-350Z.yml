                      - text: ".Isabelle introduces the idea of relational intelligence: our capacity to build trust, practise reciprocity, navigate conflict and repair, and create meaning with others. Rather than seeing intelligence only through an individual or cognitive lens, she argues that our ability to relate well may become one of the most important capabilities for the future of learning and work.Isabelle is Executive Director at"
