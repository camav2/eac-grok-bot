                  - paragraph [ref=f48e2204]:
                    - generic [ref=f48e2205]:
                      - text: "I asked AI to write the last page of my story.It left out my husband, my dog, and every desert I've ridden a bike through.You've seen the trend. You ask an AI to write the final page of the book of your life, based on everything it knows about you. I did it, because of course I did.What came back was good. Uncomfortably good. A woman who builds rooms for other people to stand in the middle of. It ended with a CEO somewhere holding a hard conversation better than she would have three years ago, and not thinking of me at all.It felt true.Then I read it again and saw who was missing.Ben. Dude. My family. The desert mornings where the only leadership question is whether my legs will hold out and my bum will survive. Years of travel that reorganised what I think is normal.The AI didn't get it wrong. It wrote back exactly what I had fed it. That version of me is a coach. Only a coach.Which is what I can't stop thinking about, because it is also what happens at work.We send in the competent part. It gets rewarded, so we send it more often, and the rest of us waits in the car park. Years pass. Then we look up and think, I don't feel like myself here.What that costs the CEOs and executives I coach, and what stepping into the whole of your personal power looks like instead, is in this week's newsletter. Link in the comments.Before you read it, ask with the question I did: if someone wrote the last page of your story using only what your work knows about you, what would be missing?"
