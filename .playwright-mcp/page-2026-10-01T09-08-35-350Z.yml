                  - paragraph [ref=f48e299]:
                    - generic [ref=f48e300]:
                      - text: It's 2004. I'm three months into a trip to India. Tonight, I'll save this photo to my iPod photo. I'll get out my Nokia and press the buttons to send a 60 cent SMS back home. Three presses for an O. Two for a K. "I'm OK" I text mum. Every day, as promised.There's no Facebook, no smartphones, no using Google Maps.There's eye contact, "hi", writing down a new friend's hotmail in your diary to keep in touch. Maps are those tissue-thin pages in my Lonely Planet I lug around with me (1kg of precious cargo!), but mostly I'll be guided by the people I meet on my travels who scrawl guesthouse names and cafes for banana pancakes in the back of my diary.I wonder how different that trip would have felt if I’d been able to share *every moment*.What if I had a smartphone to ask for advice at every turn?How would it have changed if I had AI to reach for reassurance whenever I felt... lost? There were many times I did... What would I have gained? What might I have missed?Next week, I’ll be back in India. I'm excited. India was a character-defining place for me. That iPod photo is long gone. So there's just this one photo I found, shared on email years later.Next week, I'll be speaking at
                      - 'link "View company: India Today Conclave" [ref=f48e303] [cursor=pointer]':
                        - /url: https://www.linkedin.com/showcase/india-today-conclave/
                        - strong [ref=f48e304]: India Today Conclave
                      - text: on how AI is changing our relationships and how we preserve human connection as it does... and you know what?I suspect 21 year old me armed with her dog-eared copy of Shantaram had some pretty good tips on connecting with strangers. She'd find it hard to believe that people use a machine to figure out their next move.Is there something you’re glad you experienced before you could ask your phone what to do?
