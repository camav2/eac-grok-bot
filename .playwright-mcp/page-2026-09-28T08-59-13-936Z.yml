                      - text: Ever had a moment where you’ve recognised the value of your years of experience? So an exciting opportunity came my way recently and I said yes - of course not without a flash of imposter syndrome - but it really got me thinking about the best parts of getting older. I reckon our advantage is experience, the confidence to say yes, to back ourselves. I love being at this stage in life - I’m more sure of who I am, my purpose, what l want to do, and don’t and excited by what’s ahead. So I thought I’d start a little series - all the ways I noticed my age advantage this week.And I’d love to hear yours. Let me know the moments that made glad you’re not 25 anymore!
