                              - generic [ref=f16e676]:
                                - text: "Your trauma didn't stay in your childhood. It came to work with you.Many leaders run successful businesses on the outside while something older runs the show underneath. Psychological wounds from our younger years shape how we lead, often without us noticing. Here are five common ways they show up:* Perfectionism. When love once had to be earned through achievement, excellence becomes a survival strategy. In business, it shows up as an inability to delegate, micromanaging your team, and the quiet fear that one mistake will cost you everything.* Overworking. Like any distraction from deeper suffering, long hours can be a form of addiction. And it is the only addiction society applauds. When your identity is fused with your role, you cannot zoom out to see the damage: to your health, your relationships, your judgement.* Anxious attachment. Constantly worrying that your best people will leave, because the story underneath says you are not a good enough leader. It can look like generous, conscious leadership from the outside. The engine is fear of abandonment.* Fear of loss. Perceiving threats that are nowhere in sight. The lawsuit that never comes, the client who was never unhappy. A nervous system that learnt early that everything can disappear keeps scanning for danger, even in good times.* Scarcity mindset. Growth in the numbers, but no felt sense of enough. Waking up at night over finances despite a healthy balance sheet, because an old belief whispers that you will inevitably fail.The uncomfortable question for every founder and leader: how much of your leadership style is strategy, and how much is survival?Trauma-informed leadership starts there. Not with a new framework, but with the willingness to look at what is actually driving your behaviour. Leaders who do that work stop transmitting their unprocessed patterns onto their teams, and start creating environments where people feel safe enough to do their best work.The system reflects the leader. Heal the leader, and the system gets room to breathe.What pattern do you recognise in yourself?Based on an article by"
