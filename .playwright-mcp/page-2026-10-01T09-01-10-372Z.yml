                            - text: Mothers Day again ....Two years ago, HUSH entered the world on Mother's Day.A memoir dedicated to my mother … but also an exploration of a question I had carried quietly for many decades:Why had I never become a mother myself?For years, that question felt like an empty space inside me.A heaviness I wore privately, even while life on the outside looked full.What I did not yet understand was how deeply inherited emotional patterns, unspoken loyalties, silence, grief, and identity entanglements can shape the lives we unconsciously build.Writing HUSH was not the end of that story.It was the beginning of becoming Unbound.Over the last two years, layer by layer, I have continued loosening the emotional threads that tied me to identities that were never fully mine to carry.Not through blame.Not through reinvention.But through awareness, truth, and recalibration.This photo captures something I struggled to access for much of my life:lightness. ..🎈Joy without apology🎈Presence without performance🎈Freedom without needing permissionMother’s Day can hold many emotions for women:love, gratitude, grief, longing, relief, regret, silence.So today, this is for the women quietly navigating a midlife fracture … the ones wondering whether there is still another version of themselves waiting beyond survival, expectation, or inherited stories.🎈There is!🎈And sometimes the most radical thing a woman can do …is become light enough to laugh again.
