                                                    - generic:
                                                      - text: Being part of EAC, learning the team's framework, helped me write. The community helped me dig into my courage because being an author was a communication channel I was afraid to speak in. The bonus is I made new friends and got to help more people through my work. I am grateful I invested in this community because I published Confidence Booster, my second book Speak Afraid is out in October. I now feel confident being an author, I enjoy writing, and I realised a part of who I am by stepping into this new career path. You definitely get back what you put in when inside EAC. Recommended.
