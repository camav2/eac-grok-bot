                    - generic [ref=f40e192]:
                      - text: I am about a month away from becoming an Author... and I can tell you this journey is teaching me much more than I thought was possible - for what may from the outside look like putting some words on a few pages.
                      - strong [ref=f40e193]: If I had to name just three big lessons I am learning from writing The Wild Within - here they are....
                      - text: "Writing this book has asked me to practise what I write about: navigating unfamiliar territory without losing myself. What that has looked like for me is:"
                      - strong [ref=f40e194]: 1. Let challenge take you deeper.
                      - text: Editorial feedback helped me clarify my ideas. Holding a boundary around client confidentiality also pushed me to find more creative ways to bring human uncertainty to life.
                      - strong [ref=f40e195]: 2. Ask when you don’t understand.
                      - text: What can feel obvious to an expert can be unfamiliar to a first-time author. Asking questions helped me move forward with clarity.
                      - strong [ref=f40e196]: 3. Listen to yourself - and explain what matters.
                      - text: I learned to take an uneasy feeling seriously, explore it and find words for it, even when the conversation felt awkward. Respecting someone’s expertise doesn’t mean setting aside my own perspective.These lessons reach well beyond writing a book.Where might you need to welcome a challenge, ask a question or speak up for something that matters to you today?A huge thanks to the amazing experts working at the
