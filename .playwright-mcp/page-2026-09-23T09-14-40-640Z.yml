                        - generic [ref=f7e351]:
                          - generic [ref=f7e352]: "I spent years watching brilliant educators work themselves into the ground and still feel like they were not getting anywhere. I was one of them for a long time too, good at the job, run off my feet, and no closer to the kind of leadership I wanted to be doing. That is why I wrote Leading for Tomorrow, Today. After nearly 30 years in education, as a teacher, a school leader, and now as a coach, the one thing I kept coming back to was 'strategic thinking' - a different way of deciding where to spend the effort I already had. The book walks through what I call the Leadership Blueprint Model, five stages I use with the leaders I coach: Brand, Recognise, Align, Nurture, and Demonstrate. It is the process I wish someone had handed me earlier in my career. Every chapter has a real story from my own career in it, including the parts that were not flattering at the time. My hope is that it saves you some of the years it took me to work this out. If you would like a copy of Leading for Tomorrow, Today, it is $39.95 plus postage, and I will sign it myself 😊 (Link in bio)"
