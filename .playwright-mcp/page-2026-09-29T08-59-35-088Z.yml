                          - generic [ref=f207e446]:
                            - text: "When is the choice still ours?A human can be “in the loop” and still exercise very little agency.Imagine a consequential decision.AI helps define the problem.It analyses the information.It generates the options.It compares them.It models the consequences.It recommends a course of action.A leader reviews the recommendation and approves it.The decision is technically human.But how much of the decision did the human actually author?This is one of the questions I’m exploring with leadership teams in my Leadership in the Age of AI work.Because as AI becomes better at helping us decide, leaders need to become much more deliberate about where human authorship still matters.There will be plenty of decisions where accepting a strong AI recommendation is entirely sensible.There are others that allocate resources, affect people, establish priorities, express organisational values or create commitments we will have to live with.In those moments, approval may not be enough.Someone needs to be able to say:\"This is what I believe we should do. And I understand why.\"AI can make that position better informed. It can challenge it, strengthen it and expose what we have missed. But if people repeatedly enter the decision-making process only after the problem has been framed, the options generated and the preferred answer proposed, we should pay attention to what they are becoming less practised at doing.Because capability develops partly through use.That creates a very practical leadership question:Where in your organisation does meaningful human authorship still matter?It’s one of the questions at the centre of my keynote and leadership sessions on Leadership in the Age of AI.If that is a conversation your leaders need to be having, you can explore the work here:"
