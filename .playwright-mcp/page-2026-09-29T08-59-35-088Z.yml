                          - generic [ref=f207e668]:
                            - text: "Bring 'Leadership in the Age of AI' to your next conference or leadership offsite.Help your leaders make more deliberate decisions about where to use AI, where human judgement must remain active, and how people will continue to develop expertise as the work changes.There is plenty we should happily hand to machines. The harder leadership decision is knowing what we can afford to stop doing and what we cannot afford to stop being able to do.This keynote helps leaders work through those choices:• What should we delegate to AI, and what must people remain capable of judging for themselves?• How will people develop expertise when AI can perform parts of the work they previously learned through doing?• Who owns the decision and its consequences when thinking and action are shared between people and machines?I bring research in organisational behaviour and decades of leadership experience to these questions. The focus is practical: how work is designed, where judgement sits and what people need to keep learning.Available as a keynote for conferences and leadership events, a focused leadership briefing, or an extended leadership session to examine the implications for your organisation.Explore the keynote and session options, and enquire about bringing this work to your next event:"
