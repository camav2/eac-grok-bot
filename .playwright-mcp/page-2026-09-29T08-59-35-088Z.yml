                          - generic [ref=f207e348]:
                            - text: "What are we training people not to do?AI is already changing how work gets done.The less obvious question is what that means for how capability gets built.A junior lawyer who once had to work through a body of material may now begin with a synthesis.A manager who once had to structure an argument may now begin with a draft.A consultant who once had to generate possibilities may now begin with a set of options.In each case, the work may be faster and the output may be better.But some of that work was also how people learned.This is where I think leaders need to become more deliberate.When we redesign work around AI, we are also redesigning the experiences through which judgement, expertise and confidence develop.That doesn’t mean protecting every task simply because humans used to do it.It means asking: \"Which experiences are still important because of what they build in the person?\"And: \"What new experiences do we need to create if AI now does part of that work for us?\"These are not abstract questions. They shape succession, readiness, expertise and the quality of judgement available to an organisation over time.They are also at the heart of my work on Stewardship of Human Capability.The leadership challenge is to use AI to extend capability without quietly removing the experiences through which capability develops. That is one of the central conversations in my Leadership in the Age of AI keynote and leadership sessions.If this is becoming a live issue in your organisation, you can explore the work here:"
