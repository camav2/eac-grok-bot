                            - text: A comment. A coffee. A book launch.But here's how we got here...Nine months ago I commented on a stranger's LinkedIn post.She noticed. She reached out. We met for coffee.Two and a half hours later, she handed me an early copy of her book.This Friday night, I'm her MC.That person is
                            - link "Shiran Faast" [ref=f218e883] [cursor=pointer]:
                              - /url: /in/shiran-faast/
                            - text: . More than just a Linkedin connection.And if you've never heard of her, here are five things from that coffee catch-up:1. She built a 7 figure company in an industry she had zero passion for. The book explains what that actually teaches you about business.2. When she closed it, she didn't start over. She spent six months journaling every decision she'd ever made. The book came from that.3. When she had to let go of her team, they all stayed. The book explains exactly how that happens.4. Her biggest regret after 10 years in business had nothing to do with strategy, money, or timing. It surprised me when she said it out loud.5. There is one belief she holds about employees and profitability that most business owners have completely backwards.I'm not going to explain any of these here.In conversation with Shiran about 'Unstoppable Business Growth' at Harry Hartog bookstore
                            - link "Westfield" [ref=f218e884] [cursor=pointer]:
                              - /url: https://www.linkedin.com/company/westfield/
                            - text: Carindale this Friday evening. And I'm honoured to be her MC.If your a business owner, leader or simply curious...this one is for you.Want to know more? Come to the event this Friday evening!Link to RSVP in the comments👇
