                            - text: 70% of transformations fail.Not because of bad strategy.Because most owners are solving the wrong problem.Friday evening, I MC'd Shiran for an in conversation fireside chat about her book 'Unstoppable Business Growth'.One in-depth conversation. Three important lessons:1️⃣ Stop chasing revenue.Revenue isn't a lever.It's a result.Most owners spend their entire career focused on things they cannot directly move.The actual drivers sit underneath.In how your customers are treated.In how your employees show up.In your own clarity as an owner.Get those right.The revenue follows. 2️⃣ Your people know before your numbers do.That one-star review.The resignation you didn't see coming.The marketing campaign that quietly didn't work.These aren't isolated events.They're your business sending signals.By the time it appears in your financials, it's been there for months.Most owners are trained to look in exactly the wrong direction. 3️⃣ You cannot outsource transformation.Shiran has worked with many businesses and lectures at QUT.The ones that truly changed weren't the ones with the best consultants.They were led by owners who learnt to see their business differently.That shift is internal.No one can do it for you.Shiran spent two years on this.Six drafts.A publisher who kept sending it back.She wanted a book that still matters in 20 years.I believe it will.Keep an eye out for her upcoming events.💡 Which of these three do you recognise in your own business right now?━━━━━It was an honour and privilege to be your MC
