                                - generic [ref=f58e1086]:
                                  - text: "The Audiobook Podcast is back.We're excited to bring our conversations with authors, narrators, publishers, and industry experts to the LinkedIn community.We'd love to hear your thoughts on this episode and any topics you'd like us to explore in future episodes.At SquareSound, we're proud to be industry leaders in audiobook production, helping authors and publishers bring their stories to life through exceptional audio.Episode 38: Beyond the PageIn this episode, Justine sits down with Kelly Irving to discuss one of the biggest topics shaping the writing world today: AI.Together they explore how artificial intelligence is changing the way writers create, why human expertise remains essential, and what makes writing for audio different from writing for the page.Kelly Irving is a bestselling book coach, editor, and founder of the Expert Author Community. Through her Write Book Method, she helps authors transform big ideas into trusted, impactful books while navigating the strategy behind positioning, publishing, and launching their work.Listen to Episode 38: Beyond the Page on The Audiobook Podcast:"
