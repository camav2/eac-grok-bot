                              - text: A question I’ve been sitting on for a while. I decided to start exploring this topic and the concept of slow books, serious ideas and weighty writing in an updated format on Substack. It’s an experiment with the experience (and definitely one in relation to what happens on here), and so far I’m enjoying the feeling of writing something real in a way that kind of gets back to basics.This first piece dives into long-form writing and whether books, in particular, still matter. If this topic piques your interest, I’d love to know. And I’m keen to know where you stand on this question.
