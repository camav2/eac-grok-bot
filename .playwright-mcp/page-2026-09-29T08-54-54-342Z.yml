                            - generic [ref=f58e1047]:
                              - text: Writing is naturally an iterative process, and we can see how our environment has shaped it - like when typewriters gave way to word processors, and self-publishing gave a way in to so many fringe authors. AI is the next great shaping, so I think it's an important conversation, and one I know a lot of people have questions and concerns about.Do we ignore it? Do we use it? If so, how? I discussed this at length this with
                              - link "Justine Sloane-Lees" [ref=f58e1049] [cursor=pointer]:
                                - /url: /in/justinesloanelees/
                              - text: "on The Audiobook Podcast (Episode 38: Beyond the Page) at renowned audiobook production studios"
                              - link "SquareSound" [ref=f58e1050] [cursor=pointer]:
                                - /url: https://www.linkedin.com/company/squaresound/
                              - text: "We also talked about what changes when you're writing for the ear instead of the page. Give it a listen and tell me where you land: is AI just another tool in your process, or is it changing how you think about, and approach, writing itself?"
