                            - text: Last week
                            - link "Jac Phillips" [ref=f154e473] [cursor=pointer]:
                              - /url: /in/jacphillips/
                            - text: "and I ran a Design Your Next Chapter immersion for 8 amazing women and God I wish something like this existed 22 years ago when I left my corporate role to go out on my own.If you're standing at a crossroads wondering, \"Could I work for myself?\" or \"What does my next chapter actually look like?\"... The Design Your Next Chapter Immersion is for you, and we are running it 15–17 February 2027.If you're already established and thinking more about \"How do I increase my influence?\" or \"Where is my time and energy actually going?\"... The Accelerate Your Leadership Immersion could be right for you. We are running that 19–21 April 2027.Both are three days at Lancemore Milawa. Both capped at just 8 women (small by design, not by accident). Both come with masterclasses, gourmet dinners and lunches... and the kind of conversations that don't happen in a normal work week.Design Your Next Chapter covers:→ From Ladder to Lattice→ Content Creation→ Own Your Value→ Launch Your Next ChapterAccelerate Your Leadership covers:→ Strategic Networking→ Executive Presence→ Water You Carry→ Personal Brand Power UpStill not sure which one is right for you?Ask yourself: \"What do I want my next chapter of work to be?\" or \"How do I become more effective and influential in the career I already have?\" The answer usually tells you.Early bird pricing is $3,800 + GST (before the standard $4,200 + GST kicks in).If you want more details or have questions, DM me or email me at"
