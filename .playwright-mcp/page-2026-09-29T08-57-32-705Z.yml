                            - generic [ref=f154e798]:
                              - generic [ref=f154e801]:
                                - text: I spent two inspiring days last week at the beautiful Lancemore in Milawa, in the King Valley, with nine extraordinary women. Brought together by the amazing duo
                                - link "Jac Phillips" [ref=f154e803]:
                                  - /url: /in/jacphillips/
                                - text: and
                                - link "Gabrielle Dolan" [ref=f154e805]:
                                  - /url: /in/gabrielledolan/
                                - text: for their immersive program “Designing Your Next Chapter”, we came from different backgrounds and experiences but shared so much. A genuine eagerness to learn and grow, a willingness to be vulnerable and share our dreams and fears, and a collective desire to back ourselves and build something we’re passionate about.For me, the experience was timely as I plan my own next chapter (more on that later!).If you’re thinking about making a change in your career or exploring what’s next, I’d encourage you to connect with Jac or Gabrielle and explore their programs.Thanks to Jac, Gabrielle, and my fellow collaborators
                                - link "Amy Smith" [ref=f154e807]:
