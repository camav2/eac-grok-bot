                              - generic [ref=f154e641]:
                                - text: "Earlier this month, exceptional women leaders from across Australia and around the world gathered in Sydney for IWFA Symposium 2026: Fearless Leaders. Across two days,"
                                - link "IWF Australia" [ref=f154e642]:
                                  - /url: https://www.linkedin.com/company/iwf-australia/
                                - text: members explored the forces shaping our future, from AI and technology sovereignty to climate change, political leadership, media, sports, and responsible leadership. Hosted at the historic Public Library of New South Wales, the Symposium brought together an extraordinary lineup of speakers, thought-provoking discussions, intimate Dine-Arounds, and a memorable evening at the Art Gallery of New South Wales. Thank you to everyone who helped make this gathering a celebration of connection, leadership, and community.
