                          - generic [ref=f154e760]:
                            - text: We wanted to let you know that we've scheduled our dates for our 2027 immersions.Last week we ran a different type of immersion aimed at women at a different stage of their career... those looking to design their next chapter. It was such a success that we've decided to run it again next year.
                            - link "Jac Phillips" [ref=f154e762] [cursor=pointer]:
                              - /url: /in/jacphillips/
                            - text: "and I offer two different immersions depending on what stage you are at in your career. They are:1. DESIGN YOUR NEXT CHAPTER | 15–17 February 2027This is for professional women at a career crossroads who are asking questions like: What could my next chapter look like? Could I work for myself? How do I turn my expertise into something valuable?Across the three days, we'll explore portfolio careers, consulting, board and advisory roles, content creation, knowing and owning your value, and how to actually launch your next chapter.2. ACCELERATE YOUR LEADERSHIP | 19–21 April 2027This is for successful women who are established in their careers but want to increase their impact, visibility and confidence. We'll focus on strategic networking, executive presence, where you're investing your time and energy, and building a strong personal brand.Both immersions are intentionally intimate, with only eight participants and we conduct them at Lancemore Milawa, which is in the King Valley Wine Region of Victoria.To help you decide, perhaps start with this question: Do I want to become more effective and influential in the career I have, or am I ready to work out what my next chapter could be? DM me and I will send you a more detailed brochure on both."
