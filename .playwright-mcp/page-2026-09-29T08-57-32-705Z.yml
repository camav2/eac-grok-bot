                                - text: ", and"
                                - link "Sally Lansbury" [ref=f154e819]:
                                  - /url: /in/sallylansbury/
                                - text: for the generosity, conversations, laughter, and inspiration. We all left feeling energised, connected and excited about what lies ahead.
