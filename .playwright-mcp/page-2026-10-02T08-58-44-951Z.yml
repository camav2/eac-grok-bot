                  - paragraph [ref=f38e1330]:
                    - generic [ref=f38e1331]:
                      - text: "Is our idea of merit as meritocratic as we think?For centuries, we systematically restricted contribution from half the available pool of human talent. Women couldn't access: Education Professions Property Capital Positions of authority.The injustice is obvious.But there’s another side of the equation.What did everybody else lose? How many businesses weren't built?How many discoveries weren't made?How many bad decisions survived because somebody who might have challenged them wasn't allowed into the room? We've made enormous progress around injustice to women.But genuine meritocracy is harder than simply declaring ourselves meritocratic.We confuse confidence with competence.We substitute familiarity for suitability.We favour experience over potential.And we tend to recognise leadership more easily when it looks like leadership we've seen before.For a business: It matters when hiring. And it certainly matters when investing. Diversity isn't merely a question of fairness.It's a question of intellectual range.It's a question of economic efficiency.And ultimately, it's a question of merit. Part two of The Missing Half is out now.And it ends with the question that started this whole train of thought:Why on earth wouldn't we? 📖 article 👇Ed Fowkes – Co-founder of"
