                  - paragraph [ref=f38e1630]:
                    - generic [ref=f38e1631]:
                      - text: Your LinkedIn network may be your problem.In a recent one-to-one session, I was talking to a speaker who wants to move into a different speaking market. A few months earlier, I’d advised her to start deliberately growing her network. When we spoke again, she told me something interesting.Her LinkedIn world had changed.It used to be dominated by people from her existing industry. Now she was increasingly seeing speakers and event organisers. I did a little woohoo under my breath 😊I’m delighted because if you want more corporate speaking work, but almost everybody in your network is:a former colleague,someone from your existing industry,a friend,another speaker (though these will potentially have bookers in their network)who exactly are you expecting to book you?I’m not suggesting you go on a connecting frenzy with anybody who has “events” in their job title. Be strategic.Start building a network that contains the people who:could book youcould recommend youcould introduce youwork in the organisations you want to speak forHere’s a useful little exercise.Look at your last 50 new LinkedIn connections.How many of them could conceivably lead to a speaking opportunity?If the answer is hardly any, you’ve learned something useful.We’ll be doing a lot more of this kind of practical prospecting at Find It, Win It, Grow It on 29 October.
