                  - paragraph [ref=f33e3844]:
                    - generic [ref=f33e3845]:
                      - text: CEOs are almost exclusively lurkers.Your target audience is unlikely to react and respond to your posts on LinkedIn. Why? Because they don't want to 'out' themselves as suffering with an issue on a public, professional forum.That's why your engagement mostly comes from other consultants who are, in effect, your competition.It can be dispiriting, which has the obvious effect of leading you to lose motivation and give up, becoming little more than a lurker yourself.You'll never grow your business that way.I like to think of prospects on LinkedIn as being like rabbits in a paddock. As a farmer, I know that if I see one rabbit... there's actually ten. Disguised in the grass, sleeping the burrow, wherever they're hiding, there's always ten times as many rabbits present as you can actually see.Prospective clients are the same. If *one* leaves you a like, that means ten actually liked it. If one is engaged enough to send you a comment or a DM, that means ten people were really captured by it.Multiply every vanity metric on this platform by ten, and you're closer to understanding the impact of what you're doing here. Three 'likes' is thirty people who were influenced by what you wrote. That should be enough to motivate you to keep going.It's a slow process, and the progress generally isn't obvious. But being just a little famous on LinkedIn is well worth the investment.
