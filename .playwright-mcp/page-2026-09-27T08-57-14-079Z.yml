                      - strong [ref=f33e2911]: How do you read a nonfiction book effectively?
                      - text: I have now presented
                      - strong [ref=f33e2912]: synopses of just under 700 books
                      - text: over nearly three decades. For each book, I prepare a comprehensive synopsis handout.Along the way, I have developed a pretty clear system for how I read a nonfiction book.My goal is not to remember everything in the book.
                      - strong [ref=f33e2913]: It is to identify what matters, capture it, organize it, and turn it into something I can use.
                      - text: "Here is my process:"
                      - strong [ref=f33e2914]: 1. What is the point?
                      - text: Can I state the central argument of the book clearly?
                      - strong [ref=f33e2915]: 2. Why is this book worth my time?
                      - text: What does it help me understand about my life, my work, my organization, or the world around me?
                      - strong [ref=f33e2916]: 3. What are the key highlighted passages?
                      - text: I look for powerful ideas, memorable language, good examples, and insights I don't want to lose.
                      - strong [ref=f33e2917]: 4. What are the thesis quotes?
                      - text: What sentences best capture the author's central argument—in the author's own words?
                      - strong [ref=f33e2918]: 5. What are the lessons and principles?
                      - text: "I look especially for numbered items: the three keys…the five rules…the seven principles… These often contain the most practical and memorable ideas in the book."
                      - strong [ref=f33e2919]: 6. What are MY lessons and takeaways?
                      - text: This may be the most important step.There is a difference between
                      - strong [ref=f33e2920]: what the author says
                      - text: and
                      - strong [ref=f33e2921]: what I learn from what the author says.
                      - text: What will I remember?What will I think about differently?What will I actually do differently?
                      - strong [ref=f33e2922]: Reading isn't finished when you reach the last page.
                      - text: "The real journey is:"
                      - strong [ref=f33e2923]: Understand → Capture → Distill → Apply.
                      - text: Read with purpose. Apply what matters.
                      - strong [ref=f33e2924]: I read the books. You get the insights.
