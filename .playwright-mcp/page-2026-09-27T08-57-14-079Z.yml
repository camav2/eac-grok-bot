                            - strong [ref=f33e3492]: Nick Bendel
                          - text: "’s book launch last Thursday 🥂.Quite an achievement for someone who once considered himself an introvert – and decided to do something unusual about it: Have lunch with 500 strangers.Grateful that I became lunch guest 50 early on and had the chance to observe his journey.Six years and 500 lunches later, that experiment has become his new book, \"The 500 Lunches Effect\" which I reviewed in my newsletter,"
                          - 'link "View hashtag: #learnfrombooks" [ref=f33e3494]':
                            - /url: https://www.linkedin.com/search/results/all/?keywords=%23learnfrombooks&origin=HASH_TAG_FROM_FEED
                            - strong [ref=f33e3495]: "#learnfrombooks"
                          - text: ".My biggest takeaway is beautifully simple: Action precedes confidence.Nick didn’t first become confident enough to approach strangers. He approached strangers despite feeling uncomfortable... and confidence followed.That’s what he calls Social Courage: acting despite the possibility of rejection, judgement or discomfort.His book goes far beyond networking, exploring how to talk to anyone, build meaningful relationships, pursue ambitious goals and even create your own connection project.That last part particularly resonates with me. When Nick approached lunch 400, I invited him to become guest no 1 of my own"
                          - 'link "View hashtag: #42coffees" [ref=f33e3497]':
                            - /url: https://www.linkedin.com/search/results/all/?keywords=%2342coffees&origin=HASH_TAG_FROM_FEED
                            - strong [ref=f33e3498]: "#42coffees"
                          - text: "experiment: meeting people I half knew rather than complete strangers.100+ coffees later, those conversations are influencing my upcoming book, \"The Power of Human Connection\", coming in 2027. Thanks Nick for writing the foreword!From an introvert inviting strangers to lunch to 100+ people celebrating his book launch – funny what can happen when someone simply has the courage to send an invitation.👉 Who would you invite for coffee or lunch if you weren’t worried they might say no?"
