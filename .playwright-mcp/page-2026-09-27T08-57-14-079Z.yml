                      - text: knows that someday is not a day of the week, which is why he believes in taking action now.Apart from being a smart entrepreneur, an enthusiastic networker and a skilled presenter, Gunnar is also a prolific writer.He's published 20+ books and written numerous book reviews. So I was excited when Gunnar - the 50th person I met on my quest to have lunch with 500 strangers - decided to review my new book, The 500 Lunches Effect.
