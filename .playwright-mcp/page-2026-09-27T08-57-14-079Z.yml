                      - text: .It reinforced that we're in the age of the generalist. The world doesn't have a shortage of specialists but a shortage of people who can connect the dots between them. The biggest opportunities sit between disciplines, indusWtries and problems.You need to be able to:- understand enough to ask the right questions- move between worlds- spot patterns others miss- learn quickly- turn knowledge into actionThis is also why I think the portfolio career is becoming increasingly relevant.When your career isn't confined to one job, one title, or one discipine, you get very good at bringing what you know from one world into another. This means you're a connector of expertise. So perhaps the career question we should be asking isn't 'What do you specialise in?' but 'What can you see because of the breadth of what you've done?'In an era of increasing uncertainty, generalists have definitely cemented their role
