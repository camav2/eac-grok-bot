                  - paragraph [ref=f33e2436]:
                    - generic [ref=f33e2437]:
                      - text: "10 years and one month ago, Sir Richard Branson gave me my first ever opportunity to interview someone — him — when he invited me to host Virgin Disruptors in London. I fell wildly in love with live conversation in an instant — the unpredictability, the lack of control, the constant surprise of it. It exposes whether you've really done the prep. There's nowhere to hide.In the years since, I've become obsessed with the craft: the tightrope walk of setting up talent to shine while staying deeply attuned to where the conversation is meeting your audience. I believe conversation is the invisible performance system of our lives, and I live for making it perform better — particularly in high-stakes settings.So it probably won't surprise you that I've long wanted to be in conversation with Oprah, the GOAT herself — the person who I think best personifies mastery in conversation at its best: in service of the agency and empowerment of others. Last week, on stage at the Nordic Business Forum in front of 8,500 people, I finally got my chance. She did not disappoint.I had a front-row seat to a masterclass in communication — and had the tables turned on me part-way through, when Oprah decided to throw a question at me.Ten years on from that first interview, sitting down with her for 80 minutes was a marker of how far I've come — and a reminder of how much further there still is to go.I can't wait for the conversations the next decade has in store 🙏"
