                  - paragraph [ref=f33e2306]:
                    - generic [ref=f33e2307]:
                      - text: I was getting ready for a speaking engagement this morning, and I got all wrapped up in — what do I look like? How am I going to sound? What's the audience going to think of me?And then it hit me.Self is the problem. Service is the answer.It's about how I show up and what I can give versus what I get. Sometimes I slip into that pattern and I really need to remind myself.Two mantras worth living by.
