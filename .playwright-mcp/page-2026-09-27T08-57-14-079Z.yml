                    - generic [ref=f33e3224]:
                      - text: "I’m leaving a wet and soggy New Zealand tomorrow for the warmer climes of northern Spain. Twelve months after my last Camino, I’m heading back to walk two more: the Camino Inglés and the Camino Invierno. Around 400km in total.One of the things I love most about walking the Camino is its simplicity. We choose to be snails and carry our own backpacks, which means we can stop wherever we like along the way.My pack is weighing in at around 7.5kg, much like last year. It should get a little lighter as the Kiwi peanut butter, protein bars and electrolytes disappear. I’ve packed some coffee too. My partner knows that’s the best way for both of us to start the day!I’ll be vlogging each day and have added a small drone to the kit this time. Let’s hope I don’t lose it up a tree on day one!Packed and ready to go. I’m looking forward to seeing where these paths take us.Buen Camino."
