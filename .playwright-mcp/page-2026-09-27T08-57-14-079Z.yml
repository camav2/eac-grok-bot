                  - paragraph [ref=f33e2657]:
                    - generic [ref=f33e2658]:
                      - text: "It was a real pleasure to be part of the NSCAF Safety Leadership conference yesterday. I’ve given 800 presentations over the last 13 years – but never this one.It was a connect the dots presentation - describing my long journey from severe burnout to now helping leaders build safe, resilient, and successful teams. This included: - Crashing burning as a senior leader and being out of work for 5 years - Becoming the author of the ‘Back from the Brink’ book series - Helping Gavin Larkin to start R U OK?- Co-founding WeCARE365, scalable e-learning that has trained 300,000 managers have better burnout prevention conversations- Interviewing 98 senior leaders on The Caring CEO podcast – rated #2 globally in workplace mental health- Writing my new book, Great Leaders Care With exploding workplace burnout, I also invited attendees to ask 2 urgent questions (in addition to R U OK? (Red Zone Care) Am I okay? (Self Care) Are we okay? (Crew Care) If we do this and take relevant action, we're joining the WeCare movement. We’re voting for a high-performance crew that cares about each other. Thanks for putting on such a great event,"
