                        - text: Perimenopause is one of those stages women are often left to work out alone, with patchy information and little that is practical. It's Not You, It's Perimenopause pulls the science together and makes it usable, drawing on
                        - link [ref=f12e572]:
                          - /url: /in/sarah-gray-gaicd/
