                    - link [aria-hidden] [ref=f7e690]:
                      - generic [ref=f7e691]: Wowwee how epic! Congratulations Faye! Sorry to have missed it in person but how absolutely thrilling to be supported from Expert Author Community ‘s very own Michelle Scheibner ❤️
                      - separator [ref=f7e693]
                      - generic [ref=f7e703]:
                        - text: I’m still soaking up the joy of celebrating Soulful Simplicity, surrounded by 70 wonderful colleagues, friends, and family. Seeing so many people from different chapters of my life gathered in one room was deeply moving. Each of you left an impression on my heart, and I am so grateful you chose to share this milestone with me. A very special thank you to my speakers,
                        - link [ref=f7e704]:
                          - /url: /in/michellescheibner/
                          - text: Michelle Scheibner
                        - text: and
                        - link [ref=f7e705]:
                          - /url: /in/dr-tamar-black/
                          - text: Dr Tamar Black
                        - text: for their beautiful words; to my wonderful MC,
                        - link [ref=f7e706]:
                          - /url: /in/veronika-whyte-51975bb8/
                          - text: Veronika Whyte
                        - text: for guiding us through the afternoon with such warmth; and to
                        - link [ref=f7e707]:
                          - /url: /in/janinelum/
                          - text: Janine Lum
                        - text: "for her incredible support in organising the surprise photography and the upcoming magazine review, a delicate touch only a luxury event curator can bring. The afternoon was everything I had hoped for: a warm, intimate, beautifully crafted event, with the angelic voice of Elly Poletti, exquisite gourmet canapés and sparkling wine from Harbour Kitchen, and so many moments of connection, reflection, and celebration. And to everyone who attended, got a signed copy of the book, shared a conversation, gave me a hug, took a photograph, or simply stood beside me on this very special day, thank you. A book may carry one author’s name on its cover, but moments like this remind me that no meaningful journey is ever travelled entirely alone. Soulful Simplicity is now out in the world, and what a beautiful way to celebrate it's beginning."
