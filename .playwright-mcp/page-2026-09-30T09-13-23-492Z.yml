                    - button "Open control menu for post by Maria Franzoni" [ref=f57e223] [cursor=pointer]
                  - paragraph [ref=f57e227]:
                    - generic [ref=f57e228]:
                      - text: Stop pitching event organisers when you meet them. In a recent session, a speaker told me she was going to an event where she’d be speaking on a panel. She knew there would be event organisers there and asked me what she should do. My advice? Don’t pitch them. Most speakers meet an event organiser and immediately start thinking, “How can I tell this person about me?” Turn it around. Ask them:• What are you currently seeing in the industry?• What are clients finding difficult to source?• What’s happening with budgets? And then listen. You’ll learn far more than you will from giving them your rehearsed 30-second speaker pitch. When you meet the next event organiser, you can have a much more informed conversation because you understand what’s actually happening in their world. You don’t need to persuade everybody you meet to book you, you’ll go further by understanding your market well enough to recognise where the opportunities are and how you fit them. It’s one of the things we’ll be working on at Find It, Win It, Grow It on 29 October. Did I mention
                      - link "View Mary Tillson-Wharton’s profile" [ref=f57e230] [cursor=pointer]:
                        - /url: https://www.linkedin.com/in/marytillsonwharton/
                        - strong [ref=f57e231]: Mary Tillson-Wharton
                      - text: and I are running an event? Come join us
