                                            - strong: ACT Education Directorate
                                        - text: ", working with public schools across the Australian Capital Territory (ACT) to strengthen how teachers explicitly teach self-regulated learning and metacognition.Over the past several years, I’ve worked with schools and systems to help teachers move from talking about these capabilities to actually teaching them, explicitly, in the classroom. This collaboration is the next step in that work, now at a system level with another of Australia’s public education directorates/departments.Working with a system the size of the ACT public education system is a great opportunity to think about how we can support teachers to strengthen students’ capacity to regulate their own learning.The project is a two-hour masterclass, deliberately scoped to get us started. I’m working to a November deadline, so the next few weeks will be focused on getting the content right for this audience. I'll keep you posted. Very exciting!"
