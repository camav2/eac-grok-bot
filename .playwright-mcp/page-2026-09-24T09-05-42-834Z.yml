                                            - strong: Jason Clare MP
                                        - text: "speak a few times live, but I’m always impressed with how well he speaks and the raw emotion that accompanies his words about the value of education and teachers.Interestingly, this morning I found myself reflecting on something he said: “The reading wars are over. We know what works.”Now granted, it may well have just been a poor choice of words, but the message seemed absolute. It reminded me of teaching science, and how easy it is to present our current understanding as complete. Yes, sometimes the evidence banks up so strongly that we move from “I think this is how it is” to “I know this is how it is”. But this absolutist thinking worries me. Not because we shouldn’t have confidence when evidence is strong, but because certainty can close down an open mind. Do we become less curious about what we might not yet know? or become susceptible to confirmation bias?Interestingly, I also chatted with educational leaders from school settings considered ‘innovative’ in the past, and sensed some resistance — even a sense of loss — around the current shift towards more systematic explicit/direct instruction. Those conversations prompted me to think of the “sunk-cost fallacy”: our tendency to stick with an approach because we’ve already invested time and effort into it, even when new evidence emerges.For me, both reflections were a pertinent reminder: To not become so invested in a single approach that we struggle to accept emerging evidence.That we must HOLD OUR IDEAS LIGHTLY.Congratulations to all the awardees - truly inspiring!"
