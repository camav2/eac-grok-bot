                                            - text: . She does work which I find utterly terrifying 😂She's the expert you turn to when you're the board, CEO, or executive leadership team of an organisation approaching or undergoing a significant (and potentially existential) change; merging with another organisation, undergoing a dramatic restructure, that type of stuff.She puts everything in place on the people-side to ensure that your strategy is actually executed. The projects are massive. The consequences enormous, often encompassing many hundreds or thousands of people, and with millions upon millions at stake when it's all said and done.Her clients love what she does, because she always produces the result. She's an utter marvel.And, like all humans, she's imperfect. She's brilliant at what she does best, but that doesn't mean she's brilliant at *everything*. There are several aspects of running a thriving solo business where she really needed help, and I'm so glad she found us.Libby's journey in the Solo Pro-gram over the last 18 months or so has brought a level of predictability and sustainability to her business that simply didn't exist before. As she says in the video, without the changes we've managed to produce together she might've given up by now.Over that time she's gotten greater clarity about who she serves, exactly what they're looking for and alert to, how to nurture that audience so that she's front of mind when the time is right, and how to manage her pipeline to get beyond the 'feast and famine' cycles that punctuate the early stages of many solo pro businesses.Even better, there's plenty of exciting developments on the horizon and many more successes to come.Thanks for trusting me to be your guide Libby, it really is a pleasure to work with you. (And thanks for standing on camera and telling the story yourself, it's incredibly compelling).________Massive thanks of course to
