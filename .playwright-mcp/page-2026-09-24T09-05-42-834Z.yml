                                        - text: about how great his Solo Program is. I was at the recent Summit as a participant, but snuck in some videos at the end because I wanted to capture the magic.Tall Poppy Syndrome cripples many Aussies and Kiwis. We fear being seen as big-headed bloated-ego blowhards, so we say nothing at all. Unfortunately, there ARE lots of big-headed bloated-ego blowhards in the world, and we SEE them because they're, well, big-headed bloated-ego blowhards. Nobody wants to risk being lumped in that category, so we stay quiet and hope the quality of our work will be all the promotion we need.This is silly.I've met very few people who are genuinely puffed-up buffoons, but LOADS of people who are denying the world the benefit of their expertise because they refuse to promote it. Overcoming the fear of judgement can be difficult, but it's worth trying. Or alternatively, trusting the advice of the people who know you best and promoting yourself DESPITE the fear.And yes, LinkedIn is also full of "humbled to receive this award I nominated myself for" tripe, but still. You should at the bare minimum give people the chance to learn what you do, and make yourself easy to refer. Right after she recorded this video for Col,
