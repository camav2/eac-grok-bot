                              - img "LinkedIn Verified" [ref=e1325]
                            - time [ref=e1327]: • 3:34 AM
                          - generic [ref=e1328]:
                            - generic [ref=e1329]: "Kelly: Hey KJ, That’s amazing to hear! Sometimes the best way forward is just to start. I work with authors across a range of topics, but what really lights me up is helping people turn their lived experiences and unique perspectives into something powerful that serves both their audience and their bigger mission. Student success, leadership, equity - those are incredibly valuable lenses. I’d love to hear more about the focus of your book. What direction are you heading in, KJ? Kx"
                            - button [ref=e1330] [cursor=pointer]:
                              - text: …
                              - strong [ref=e1331]: see more
                          - paragraph [ref=e1335]: "Here's the overview:“Broken Pieces” is a raw, honest, and profoundly moving account of navigating chronic trauma, finding unexpected miracles, and sustaining faith in the face of unimaginable hardship. At its core, this is the true story of a family’s unwavering fight for their son, Kaleb, who suffered profound brain trauma at three months old. Author Krandon Henry takes us on a journey that begins in the chaos of NICU and PICU, through years of medical challenges—including dismissed concerns about pneumonia and pancreatitis—to a present defined by steady, watchful hope. It is a testament to the fact that even when \"things have gone really wrong,\" breakthroughs can emerge through unconventional means. What makes this narrative truly compelling is its exploration of \"randomnimities\"—those seemingly coincidental moments that, in retrospect, reveal a divine orchestration. The author recounts pivotal encounters: a chance stop at a conference on applied psychophysiology leading to insights about specialized tests for Kaleb's brain; a seemingly ordinary trip to buy raspberry seedlings resulting in a connection with an acupuncturist whose laser therapy aligns perfectly with prayers for neural pathway activation; and a steam room conversation at the gym unveiling a pharmaceutical company capable of gene editing. These are not just anecdotes; they are powerful affirmations of an unseen hand at work, reminding the reader that \"God sees us. He’s moving pieces behind the scenes. And Kaleb? Kaleb is still on His radar.\" Beyond Kaleb's medical journey, the book delves into universal themes of resilience, healing, and faith. The author eloquently argues that our \"cracks\"—our experiences of brokenness, grief, and disappointment—do not diminish us but instead become testaments to our strength and sources of unique beauty. This is a profound and timely message in a world grappling with widespread trauma. The second part of the book, \"The Healing Path,\" offers a compassionate roadmap for navigating chronic trauma, emphasizing self-awareness, grounding techniques, seeking expert navigation, cultivating supportive communities, and embracing creative expression. It moves from coping to thriving, building \"roots of resilience\" through a growth mindset, emotional navigation, and intentional self-care. This section offers practical, actionable wisdom for anyone on their own healing journey, grounding psychological insights in deeply personal experience. Finally, \"The Faith Walk\" provides a powerful spiritual foundation for enduring life's storms. It distinguishes fleeting happiness from an unyielding, grace-rooted joy, and challenges readers to \"tend to your healing soul\" and maintain hope, not as passive optimism, but as an active, biblically anchored trust. The author’s honest wrestling with the \"Where is God while I’m suffering?\" question offers a relatable and authentic perspective on faith in adversity, leading to a compelling call to \"guard your heart with all diligence.\" The concept of \"Upcycling TRAGEDY\" through confronting temptation, regret, adversity, grief, envy, and disappointment, ultimately yielding to a higher purpose, provides a transformative framework for readers. This book is more than a memoir; it is a testament to unwavering love, audacious hope, and the quiet miracles that unfold when faith meets the deepest forms of human suffering. It is written with a powerful voice—direct, vulnerable, and deeply authentic."
