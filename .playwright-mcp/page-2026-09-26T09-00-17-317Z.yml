                      - text: – she knew this instinctively. She wasn't writing for job seekers in general, or even everyone over 45. Her audience was … job seekers … over 45 … coming back to work after a career break.Her book, Job Gaps to Job Offers for 45+, is brief and practical. No impossible promises, no fluff, just measured, useful information for people who've been out of the workforce for a while.What kind of gap will your book fill?
