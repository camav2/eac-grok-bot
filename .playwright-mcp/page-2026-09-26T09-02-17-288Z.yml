                      - text: I used to walk through airports with a coffee in one hand and a boarding pass in the other…🤘Now I walk through so many airports (still with a coffee and many more boarding passes🤣) and see my book sitting on every airport book shelf!🙌My words. My dream. Right next to humans that I have learned from and admired for years. Brené Brown, The Dalai Lama (what?!🤯), James Clear, Jay Shetty. It’s something I am still wrapping my head around. 🧡I feel proud, very much in awe, and so very grateful about the whole thing. ✈️Yep, airports feel very different these days and so much more exciting - for a travel obsessed human it’s the icing on the cake. 🙏If you’ve read my book and love it I’d be ever so grateful for a review wherever you normally leave one. Or send me a few words to use. They help get my book into more hearts and hands to co-create a ripple of
