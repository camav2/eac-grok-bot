                  - paragraph [ref=f65e577]:
                    - generic [ref=f65e578]:
                      - text: "I had the pleasure of joining more than 150 people at WA Museum Boola Bardip for the FameLab Australia 2026 National Final, where 13 early-career researchers took on the task of explaining their research in just three minutes. FameLab is the world’s leading science communication competition. Early career researchers have just three minutes to present their research in a clear and accessible way. PowerPoint presentations and jargon are definitely banned and the researchers are judged on the three C’s: Content, Clarity and Charisma. As ever, the audience was given quite a show with plenty of creative wordplay, compelling performances and a variety of props. Congratulations to this year’s Australian champion, Dr Amelia Harray from The University of Western Australia, whose presentation, ‘You are what you eat it out of’, explored whether reducing our exposure to plastics through diet and lifestyle changes can improve health outcomes. I will be (responsibly) disposing of my plastic lunchbox as a result. Amelia will now represent Australia at the FameLab International Final in Katowice, Poland, on 5 December. It was also lovely to welcome last year’s Australian winner, Tammy Lee, back to Boola Bardip as MC for the evening. Tammy went on from FameLab Australia to compete in Geneva, where she was crowned the world’s best science communicator. A hard act to follow, certainly, but after hearing Amelia last night I think Australia will once again be very well represented! My congratulations also go to joint runners-up Kinta Pinchin-Yamada from"
                      - 'link "View company: The University of Notre Dame Australia" [ref=f65e580] [cursor=pointer]':
                        - /url: https://www.linkedin.com/school/the-university-of-notre-dame-australia/
                        - strong [ref=f65e581]: The University of Notre Dame Australia
                      - text: "(‘Before the final siren: When the brain's defenders become its destroyers’), and Ollie Sharp from"
