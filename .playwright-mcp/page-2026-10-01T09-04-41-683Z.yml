                                - generic [ref=f35e2640]:
                                  - text: "Join us for a Community Book Launch celebrating three incredible authors! 📚We're opening our doors for a free public event to celebrate the launch of three amazing books from Expert Author Community members. This isn't your typical book launch - rather than hearing each author talk about their own work, you'll discover what they think about and take away from each other's books, plus get insider insights into their authoring journey.Celebrating these incredible books:📕 Andrew Sloan - \"Why things feel f*ckd: Your Practical Guide to Getting Unstuck\"📗 Sarah Gray - \"It's Not You, It's Perimenopause: Science-based lifestyle and supplement solutions to help you thrive in midlife\"📘 Siobhán O'Riordan - \"Reframe: How Generalists Thrive in a Changing World\"Perfect for aspiring authors, book lovers, and anyone curious about the publishing process. You'll get inspired by real author stories, learn how community-first book launches work, and connect with like-minded people who believe in the power of books to create change. As one previous attendee shared: \"The 'normal-ness' of everyone reinforces that we can all do this write-a-book thing!\"📆 When: December 5th, 2025 | 10am AEST / 8am AWST📍 Where: Zoom (free to attend)⭐ Register:"
                                  - link "https://lnkd.in/gY5fwweJ" [ref=f35e2641]:
