                            - generic [ref=f35e2761]:
                              - text: Our final book launch of the year is here - and it's a triple banger!Tomorrow, we’re wrapping up 2025 with three incredible authors launching their books together in one big celebration
                              - link "Andrew Sloan" [ref=f35e2763] [cursor=pointer]:
