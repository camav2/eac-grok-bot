                                - generic [ref=f35e1862]:
                                  - text: Its been a VERY big few weeks of exciting things...👏 Most importantly my book cover was officially released publicly into the wild last night! What a surreal and yet deeply satisfying (and HUGELY THRILLING!) moment to experience. 🧡 Grateful to my book publisher
                                  - link "Natasha Gilmour" [ref=f35e1864]:
                                    - /url: /in/thekindpress/
                                  - text: at The Kind Press (yes what a beautiful synergistic collaboration hey?!) My publisher has been my number 1 supporter and guide from day 1 and I could not have wished for a better person to partner with. She has wholeheartedly believed in me and my book idea - Kind Leadership and Self Kindness - proving to me that what I have so deeply cared about for so long would be perfect in book form.💛 I also wouldn't have got to this stage without
                                  - link "Kelly Irving" [ref=f35e1866]:
                                    - /url: /in/kelly-irving/
                                  - text: and the wonderful humans within the
                                  - link "Expert Author Community" [ref=f35e1867]:
                                    - /url: https://www.linkedin.com/company/expert-author-community/
                                  - text: 🧡 ☀️ The Author Community has given me the structure, accountability and a network of support when I've needed all of these things to get to the point of publishing. I also met Natasha through another author who had recently published with her. 🌈 Just after I had signed the contract with The Kind Press, Natasha excitedly rang me to tell me that she had formed a distribution relationship with
                                  - link "Simon & Schuster" [ref=f35e1870]:
                                    - /url: https://www.linkedin.com/company/simonandschuster/
                                  - text: Australia and that my book would be distributed through them. It's available to order at
                                  - link "Booktopia" [ref=f35e1873]:
                                    - /url: https://www.linkedin.com/company/booktopia/
                                  - link "Dymocks Books" [ref=f35e1876]:
                                    - /url: https://www.linkedin.com/company/dymocks/
                                  - link "Amazon" [ref=f35e1879]:
                                    - /url: https://www.linkedin.com/company/amazon/
                                  - link "thenilegroup" [ref=f35e1882]:
                                    - /url: https://www.linkedin.com/company/thenilegroup/
                                  - link "QBD Books" [ref=f35e1885]:
                                    - /url: https://www.linkedin.com/company/qbd-books-australia/
                                  - link "Readings" [ref=f35e1888]:
                                    - /url: https://www.linkedin.com/company/readings/
                                  - text: and all bookstores and online retailers.💯 Its not often I ask for anything here on
                                  - link "hashtag LinkedIn" [ref=f35e1891]:
                                    - /url: https://www.linkedin.com/search/results/all/?keywords=%23linkedin&origin=HASH_TAG_FROM_FEED
                                    - generic [ref=f35e1892]: hashtag
                                    - generic [ref=f35e1893]: "#LinkedIn"
                                  - text: because I prefer to give and support others, however, I am asking for a favour now:Pre orders will help extend the reach and impact of my book in a hugely meaningful way. The thought of it landing in many hands, and hopefully many hearts, truly makes my heart smile.📚 Pre purchases officially open next Tuesday 3rd March and in store on the 30th June. Link to Simon and Schuster will be in the comments for more information. Also the link is in my bio to either pre purchase or join my book waitlist which will give you access to all sorts of brilliant things book-related. 🤩 This is truly a wonderful moment and I am taking the time to revel in it before things start to ramp up in the lead up to it being released.🧡🩷 Oh also, I think the cover designer absolutely nailed the brief and the feedback I've already received from those who have seen it is that its me, in book form. I cant argue with that. What do you think? KindestSoph 🌈 ☀️
