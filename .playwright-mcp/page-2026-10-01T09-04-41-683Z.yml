                                - /url: http://bigseastrategies.com/book
                              - text: 📚 It’s Not You, It’s Perimenopause –
                              - link "https://lnkd.in/gTppdbdY" [ref=f35e2465] [cursor=pointer]:
                                - /url: https://lnkd.in/gTppdbdY
                              - text: if you joined us today, please share the love for our authors here 👇👇 What was your biggest takeaway from the morning?Kx***Aspiring authors, don't forget we have a special offer on until 15th December to help you start or finish your book
