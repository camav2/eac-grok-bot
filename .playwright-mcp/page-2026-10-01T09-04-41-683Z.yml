                            - generic [ref=f35e2453]:
                              - text: This morning reminded me exactly why we write. I'm still buzzing from our latest
                              - link "Expert Author Community" [ref=f35e2454] [cursor=pointer]:
                                - /url: https://www.linkedin.com/company/expert-author-community/
                              - text: Book Launch where we celebrated three of our incredible authors -
                              - link "Andrew Sloan" [ref=f35e2458] [cursor=pointer]:
                                - /url: /in/andrewwilliamsloan/
                              - link "Siobhán O'Riordan" [ref=f35e2460] [cursor=pointer]:
                                - /url: /in/saoriordan/
                              - text: and
                              - link "Sarah Gray GAICD" [ref=f35e2462] [cursor=pointer]:
                                - /url: /in/sarah-gray-gaicd/
                              - text: From Andrew’s raw honesty about navigating life when “things feel f*cked”, to Siobhan’s validation of the zigzag path so many generalists walk, to Sarah’s grounded, science-backed support for women moving through perimenopause - each one left me reflecting on how powerful it is to turn lived experience into something that serves others.There was no ego, no performance - just authors who had done the work, asking thoughtful, vulnerable questions of their peers. To those 55+ of you who joined us live - thank you. Your presence made the celebration even more meaningful. And to those who couldn’t make it, I hope you’ll take a moment to check out the books and support these brilliant humans.Buy or gift their books here - it will mean the world to them and help someone in your circle:📚 Why Things Feel So Fcked* –
                              - link "andrewsloan.com.au" [ref=f35e2463] [cursor=pointer]:
                                - /url: http://andrewsloan.com.au
                              - text: 📚 Reframe –
