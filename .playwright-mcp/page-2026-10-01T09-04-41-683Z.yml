                                - /url: /in/sarah-gray-gaicd/
                              - text: It’s a moment that reflects so much of what the
                              - link "Expert Author Community" [ref=f35e2768] [cursor=pointer]:
                                - /url: https://www.linkedin.com/company/expert-author-community/
                              - text: "is about: Clarity of messageCourage to share itAnd connection through a room full of people cheering you on.To date, we have supported 144 published authors through the EAC - with an incredible 14 authors set to launch in the next 3 to 6 months. If you're craving an energising convo that will help you step into your next chapter and the Year of the Horse with fresh energy and opportunities - join us.📅 When: 5th December at 10am AEDT (90 mins) 🎉 Where:"
                              - link "https://lnkd.in/ghTVy5jX" [ref=f35e2771] [cursor=pointer]:
