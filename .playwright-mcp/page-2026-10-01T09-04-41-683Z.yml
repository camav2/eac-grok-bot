                                - /url: /in/sarah-gray-gaicd/
                              - link "Sarah Patterson" [ref=f35e3097] [cursor=pointer]:
                                - /url: /in/sarahpatterson23/
                              - text: "And to Andrew - what a joy you are!Why Things Feel F*ucked is out now: 👉"
                              - link "https://lnkd.in/gMJtz3N4" [ref=f35e3098] [cursor=pointer]:
                                - /url: https://lnkd.in/gMJtz3N4
                              - text: 📚 If you missed it, you’ve got one more chance to join this celebration.Come along to our online Community Book Launch with
                              - link "Andrew Sloan" [ref=f35e3100] [cursor=pointer]:
                                - /url: /in/andrewwilliamsloan/
                              - text: ","
