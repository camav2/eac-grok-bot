                            - generic [ref=f35e3068]:
                              - text: Ever been to a book wedding?We just did. And my heart is full; my eyes still puffy. Last night, one of our own, the brilliant
                              - link "Andrew Sloan" [ref=f35e3070] [cursor=pointer]:
                                - /url: /in/andrewwilliamsloan/
                              - text: ", launched Why Things Feel F*cked - and this one really took the cake (quite literally, the cake of his book cover was huge!)This was not your average book launch.There were tears. There were hugs. There were 105 people!And right up the front? Three whole rows packed with"
                              - link "Expert Author Community" [ref=f35e3071] [cursor=pointer]:
                                - /url: https://www.linkedin.com/company/expert-author-community/
                              - text: "members past and present - all showing up, cheering loud, and celebrating one of their own.Authors like Andrew are the heartbeat of our community: generous, focused, and full of grit.It was incredible to see just how much the EAC has not only grown in numbers, but grown in depth, support and spirit in such a short space of time since Andrew joined in Intake 2. We’ve published 147 books (and counting), but it’s moments like these that remind me what we’re really doing here: writing legacies together.So to everyone, especially our EACers, who came last night- thank you."
                              - link "Graeme Cowan" [ref=f35e3075] [cursor=pointer]:
                                - /url: /in/graemecowan1/
                              - link "Anna Hutchison" [ref=f35e3077] [cursor=pointer]:
                                - /url: /in/annahutchison/
                              - link "Penelope Barr" [ref=f35e3079] [cursor=pointer]:
                                - /url: /in/penelopebarr/
