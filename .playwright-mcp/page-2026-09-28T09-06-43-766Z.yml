                                    - generic [ref=f202e521]: • 2nd
                              - paragraph [ref=f202e525]: Social Entrepreneur 🖼️ Artfullness & 📚 Educacion Diversa | Human Rights Advocacy, Art Education & Mental Health 💪🏽ACT Finalist Aust of the Yr 2026 🏆ACT Woman of the Yr 2025 Board Member @Build Like a Girl & WWDACT
                              - paragraph [ref=f202e527]: 6d
                              - link "Lauren Cannell Premium Profile 2nd":
                                - /url: https://www.linkedin.com/in/lauren-cannell-educacion-diversa/
                            - link "Invite Lauren Cannell to connect" [ref=f202e531] [cursor=pointer]:
                              - /url: https://www.linkedin.com/search/results/all/?keywords=Stories%20That%20Stir%20Brisbane%20Strength%20Eric%20Em&origin=GLOBAL_SEARCH_HEADER
                              - generic [ref=f202e532]: Connect
                            - button "Open control menu for post by Lauren Cannell" [ref=f202e536] [cursor=pointer]
                          - paragraph [ref=f202e539]:
                            - generic [ref=f202e540]:
                              - text: It’s almost time to move into our studio as official residence of the Ainslie Arts Centre in Braddon. We’re busily preparing room 2 to become our new home and as part of that we’re going to use two afternoons next term to roll out the top two programs from the below poll.1. Feminism for fairies and fighters is a 10 week program that introduces young people in our community to the different feminist movements that helped contribute towards gender equality. Through this program children and young people learn about the importance of contributing to gender quality and how through treating people equally and providing equity for those who can’t access things the same we’re actually creating healthy communities. 2. Women are STAR - a 5 week program that helps young women understand their bodies, brains and the complex social situations they’ll experience as they move from being a child into becoming a teenager. This program empowers is designed to create long lasting friendships that harness inclusivity and mutual respect to ensure every girl leaves feeling good.3. Boys just want to have fun - an all boys art class to spark and continue the creativity in boys aged 8-14, the typical age a lot of them drop art and start focussing on testosterone drive activities. We believe continuing art can help control that, while having fun in a safe space with other boys.4. Create and Belong - a safe space for all gender children and young people to come together and share stories while they create. Each activity focusses on different topics that all link back to social inclusion.5. Heartfullness - a ten week program that teaches children and young people about emotional intelligence. It includes navigating complex emotions, understanding different emotions and how to recognise them in ourselves and in others. Lastly it come with creative tools to manage their own emotions and keep themselves safe from others.Even if you’re not Canberra based and/or have children or young people, your opinion matters to me. Please take this poll and help me decide where to start! 👇🏾
