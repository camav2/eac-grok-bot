                            - button "Open control menu for post by Andrea Gullick" [ref=f202e435] [cursor=pointer]
                          - paragraph [ref=f202e438]:
                            - generic [ref=f202e439]:
                              - text: What does Courage mean to you? For some, sitting in a dentist's chair takes every bit of courage. For others, it's asking for that pay rise they know they deserve. Courage comes in all shapes and sizes and is called upon in all different scenarios. I thought it took all my courage to navigate traumas in quick succession but I realise that took strength. What took real courage was to navigate a journey with anti-depressants and coming home to my own truth about them. Sometimes we need to lean in and listen to others, sometimes we need to lean out and listen to ourselves. Thanks
