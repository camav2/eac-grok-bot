                      - text: ", who expertly guided our discussion from the vilification and blaming of individuals for burnout through to best practice in high performance culture and burnout management.Thank you to everyone who joined me. The buzz over lunch reinforced the need to bring this topic to the surface more often.Built to Burn is 3 years of research, leading to a variety of conclusions and a host of frameworks and advice to build healthy, high performing teams, leaders and organisations.It's available for preorder until the end of the month through Amazon, Booktopia or wherever you buy your books. From 1 October you can order it online or wander into any bookstore and grab a copy."
