            - paragraph [ref=f63e40]:
              - text: Whew, what a week. I delivered a pre-conference keynote for POTCA (Paediatric Occupational Therapy Conference Australia) on ethical AI, and it might be one of my favourite sessions yet.
              - link "Rebecca Lockyer" [ref=f63e41] [cursor=pointer]:
                - /url: https://www.linkedin.com/in/rebecca-lockyer-62866474?trk=public_post_embed-text
              - text: and I built it around the idea of "building understanding" (literally), taking the room behind the scenes into how we've designed
              - link "Understanding Zoe" [ref=f63e42] [cursor=pointer]:
                - /url: https://www.linkedin.com/company/understandingzoe?trk=public_post_embed-text
              - text: "with an ethical AI framework from day one. What we chose to build. What we refused to build. The bias in generic AI, from ableism to gender bias to racism, and how we design against it. Why we chose a strength-based, affirming approach over a clinical, deficit-based one. How we guard against hallucination. What duty of care looks like when the people using your tool are parents and clinicians who need to trust it. Feel free to send me a message if any of those topics interest you! Happy to chat about it. Thank you to Rebecca for having me! Next up: Brisbane in November, in person, exhibiting at POTCA as a partner and talking ethical AI all over again. It's a paediatric OT conference that leads with an affirming approach, and I'm genuinely excited to be part of it."
