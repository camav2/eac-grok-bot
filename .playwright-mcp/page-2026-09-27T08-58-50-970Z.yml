                            - text: What does it look like to work a weekend? Last Saturday we were had a stall for
                            - link [ref=f50e1714] [cursor=pointer]:
                              - /url: https://www.linkedin.com/company/understandingzoe/
                              - generic [ref=f50e828]: Understanding Zoe
                            - text: at Carer Gateway's Learning NDIS Day, and being invited to speak about my own lived experience navigating the NDIS as a parent. I stood up and shared my story. All of it. The rawness of a broken system, the confusion, the exhaustion, the moments I didn't think I could keep advocating. What made it so special was looking out at a room full of people who were either starting that same journey or deep in the middle of it. I made people cry. I made people laugh. And afterwards, so many came up to tell me it was the most authentic talk they'd heard, thanking me not just for my vulnerability, but for building something that actually helps... a way to prepare for plan reviews, gather evidence of day to day life, and draft impact statements that reflect reality. That's the part that means the most to me. Taking the wounds of my own broken experience and turning them into something that becomes part of the solution for someone else. It was a privilege to share the day with so many others working to make this system easier to navigate, including the speakers Ben Morelli (NDIA Presentation),
