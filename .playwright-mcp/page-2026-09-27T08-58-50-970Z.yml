                          - generic [ref=f50e967]:
                            - text: Your executive function is the part of you that starts, holds, switches and returns to tasks. Right now, that system is under more load than ever, and most workplaces are still treating it as a character flaw instead of what it is. That's where I opened at Parents At Work's Inclusive Leader Series this week, building on work I've done with organisations like Telstra, but going deeper on what leaders can actually do about it. We're all switching tasks constantly, often with AI layered on top, and calling people "inconsistent" or "disengaged" when what's actually happening is a system under strain. Give people room for a genuine reset and both output and wellbeing improve. That's not a soft perk, it's the return on investment. I also spoke about carrying a neurodivergent child and what that costs at work when the system isn't built to hold it. Parents doing that second, invisible shift are stretched the same way, and the fix is the same too. I shared from my own experience as well. Asking for noise cancelling headphones. Asking for a chair I could move in. Asking for a Swiss ball at my desk while pregnant, long before I had language for any of it. Small adjustments, made without needing to disclose, that let me stay in the room instead of quietly leaving it. Thank you
