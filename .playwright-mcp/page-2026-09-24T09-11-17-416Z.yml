                          - generic [ref=f16e612]:
                            - text: Last week I had the pleasure of spending the day with the team at Para Hills High School exploring an important question:What knowledge and skills do students need to become self-regulated learners?It sounds like a simple question. But once a room full of teachers starts unpacking it together, things get interesting.What does a self-regulated learner actually do? What strategies do they need? How do we explicitly teach those strategies? And how do we gradually support students to use them without relying on us?I loved the engagement in the room. Teachers tested ideas against their own classrooms, challenged the thinking, and explored what this could look like in practice.The feedback afterwards was incredibly generous. Staff described the day as engaging, relevant, accessible and practical — with one educator sharing:“I was probably not really ‘sold’ on the idea of metacognition before this presentation — but now I feel like there is more purpose for this concept.”That one brought a smile to my face.A huge thank you to Matthew Zviedrans,
                            - link "Novi Palmer" [ref=f16e614] [cursor=pointer]:
                              - /url: /in/novi-palmer-528568319/
                            - text: "-Amran, and the whole Para Hills High School team for the incredibly warm welcome — and, more importantly, for investing in helping students become better learners.I’m looking forward to seeing where the SRL journey takes you next.And if your school is beginning to ask similar questions about metacognition and self-regulated learning, I'd love to work with you.2027 bookings are now open. Visit:"
