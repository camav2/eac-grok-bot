                          - button "Open control menu for post by Dr Shyam Barr" [ref=f16e723] [cursor=pointer]
                        - generic [ref=f16e727]:
                          - generic [ref=f16e730]:
                            - text: "I've been working with a school here in the ACT for a number of years, supporting their focus on metacognition and self-regulated learning (SRL). Recently, the leadership team raised an interesting challenge:“Some students know the learning strategies they've been explicitly taught. They can explain them. They can demonstrate them when asked. But they aren't necessarily using them independently to regulate their learning.”It prompted me to revisit a distinction in the research that I think is really useful for educators: availability deficiency vs production deficiency.Put simply: Does the student not have the strategy available to them? Or do they have it, but aren't using it when it's needed?Being able to tell the difference has important implications for how you teach SRL—and what a student might need from you next.I've unpacked the idea (with the help of an umbrella metaphor ☂️) in my latest blog: When students know what to do, but don't do it. (Link in comments)."
