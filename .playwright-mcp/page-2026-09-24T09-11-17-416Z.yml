                          - generic [ref=f16e483]:
                            - text: "Before you can teach students to regulate, you need to know where they actually are.In the recent episode of Educate to Self-Regulate, Paula shares how her staff came together to map where students were in relation to personal and social capability.They started with the basics: Do students know what an emotion is? Can they identify it in the moment? Can they regulate?Then, they tracked this across their students, and the shifts were significant - Paula describes students who had previously been physically aggressive becoming engaged and independent learners. Major behaviours decreased by 85%.Note: every behaviour incident takes time away from learning.Emotional awareness isn't a soft add-on. It is part of the foundation students need to become better self-regulated learners.Listen to the full episode to hear how Paula's team built this into their context.Tune in to Spotify, Apple Podcasts or watch the full episode on YouTube:"
