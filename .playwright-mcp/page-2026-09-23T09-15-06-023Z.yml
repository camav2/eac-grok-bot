                          - generic [ref=f20e341]:
                            - text: There is something so special about the intimate conversation we can have about what's really at the heart of our relationships. It was my privilege to spend time with the staff and parent community at Holy Spirit Catholic Primary School and
                            - link "Rachel Holdsworth" [ref=f20e343] [cursor=pointer]:
                              - /url: /in/rachel-holdsworth-b40223274/
                            - text: .What stayed with me most was the openness in the room, the willingness to reflect not only on children’s behaviour, but on what happens within us in relationship with them.That takes courage.Because understanding behaviour isn’t simply about asking, “What is this child doing?” It’s also being willing to ask:“Am I responding to the child in front of me, or reacting from the child within me?”There was such honesty, curiosity and compassion in the conversations we shared.Thank you Rachel and the Holy Spirit team for trusting me with your community, and for creating a culture where staff and families are encouraged to reflect, grow and stay connected through the hard moments.This is where meaningful change begins - in relationship. ❤️
