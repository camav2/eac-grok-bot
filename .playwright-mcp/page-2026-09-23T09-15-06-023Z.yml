                          - generic [ref=f20e793]: Sometimes leadership is simply staying beside someone.Our beautiful golden retriever, Faith, had just come home after an operation when my husband, Chris, lay down beside her.He wasn’t trying to fix anything. He was simply there, loving her, soothing her and letting her know she wasn’t alone.Faith has done the same for us many times. She always acknowledges our presence and greets us as though seeing us is the best part of her day. When one of us is upset, she gently comes alongside and places a paw on our leg.Now she needs us, and we are beside her.Looking at this photo made me think about leadership, not only in our workplaces, but in our homes and relationships.We often associate leadership with having answers, making decisions or knowing what to do next. But some of the most important moments of leadership happen when someone is struggling and we resist the urge to immediately fix, advise or move them on.Instead, we notice, listen and stay close enough for them to know they are not facing it alone.Whether we are leading a team or a family, people are affected by how they experience us. Do they feel acknowledged when they enter the room? Do they feel safe enough to tell us when something is difficult? Do they experience our curiosity, or only our correction?I often think of relationships as being like a baby mobile. When one part moves, every other part is affected. The way one person speaks, withdraws, reaches out, responds or repairs can shift the whole system.This isn’t about blaming a leader, a parent or any one person for how a workplace or family feels. It is about recognising the influence we each carry.When one person softens, it can become safer for someone else to soften too. Curiosity instead of criticism can change the direction of a conversation, while acknowledging hurt can open the way for repair.Good leadership does not mean removing every difficulty or always knowing what to say. Sometimes it means creating the conditions in which people feel seen, supported and able to find their way forward.At work or at home, the presence we bring matters.Sometimes leadership simply says:I see you. I’m here. You matter to me.
