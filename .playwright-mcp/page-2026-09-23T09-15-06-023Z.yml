                          - generic [ref=f20e589]:
                            - text: The world has lost someone truly extraordinary.I have always loved Dolly Parton, not only for her music, humour and unmistakable sparkle, but for the woman she allowed herself to be.She was real, honest, open and warm. She carried herself with grace, loved generously and showed unwavering kindness. She seemed to understand that strength didn’t require hardness and vulnerability didn’t make us weak.Dolly taught us to rise above the opinions of others without losing our softness. To embrace who we are, rather than becoming who the world expects us to be. She never made herself smaller to make other people more comfortable.Perhaps that is why the world loved her so much. She made people feel that they could belong without having to become someone else first.At this stage of my own life, I’m finding the courage to show more of who I am, trust my own voice and take up my place in the world. I feel especially grateful for women like Dolly, who showed us how to do that with grace, humour and love.What a beautiful Heartprint she has left on the world.Rest peacefully, Dolly. Thank you for reminding us that strength, vulnerability, grace and love can all live side by side. 🤍
