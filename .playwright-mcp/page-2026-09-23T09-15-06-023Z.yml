                          - generic [ref=f20e482]: "If you've ever worried that your anxiety might be impacting your children, you're not alone.In this compassionate conversation, Dr Jodi Richardson is joined by family therapist and author Lisa Taylor to explore one of the most common concerns anxious parents have: \"Am I affecting my kids?\" Together, they discuss the difference between sharing feelings and burdening children, how anxiety can sometimes lead to overprotection, and why children don't need perfect parents; they need honest, connected ones.You'll hear practical strategies for talking to children about anxiety, supporting their independence, and helping them understand that a parent's feelings are never their responsibility to fix."
