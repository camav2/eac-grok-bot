                    - generic [ref=f99e3462]:
                      - text: When women’s voices are missing from the rooms where decisions get made, organizations suffer. In The Clearest Voice in the Room,
                      - link "View Dr. Kristine Sickels’ profile" [ref=f99e3464] [cursor=pointer]:
                        - /url: https://www.linkedin.com/in/drkristinesickels/
                        - strong [ref=f99e3465]: Dr. Kristine Sickels
                      - text: ", a corporate executive turned entrepreneur, investor, and speaking coach, will guide you to become a powerful speaker and leader—a woman who gets remembered. It’s how you drive results for your organization, inspire your team, and advance in your own career.Through Dr. Sickel's VOICE framework (Values, Outcome, Identity, Consistency, Energy), you'll learn to speak with intention and make your mark—even in spaces where women’s voices have historically been muted. With compelling research on women in the workforce, relatable stories from Dr. Sickels’s corporate career, and concepts that are simple yet powerful, this must-read will shift the way you show up and speak.Read now:"
