                  - paragraph [ref=f99e1160]:
                    - generic [ref=f99e1161]:
                      - text: "“You nicely balanced paranoia and positivity”This was probably my favourite audience comment after my HEXPO 2026 talk last Friday. In this quick talk I shared one of the topics I’ve been watching recently (everything is surveillance) and looked at where ideas already exist about how that might play out over the next few years, within the films and books we already know.Talking about these topics at events is always a balance. I don’t want to be The Un-Fun One, but also we need to talk about them. The punchline of all of my talks on the future is that (spoiler alert) we all have a level of agency. What we choose to create, accept, challenge, opt in/out of, contribute to, and reject has a direct impact on the outcome. Sometimes just for us and the people around us, and sometimes at a much larger scale.Someone asked a question in the Q&A which (very summarised) was: ‘we have lots of demand [in the business] so some people are putting pressure on us to use AI as we can do more work, and make more money. But doing that will also likely put [specific group of workers] out of work eventually, who are the ones with the skills we were previously selling’These are exactly the moments and examples where we get to choose what future we’re contributing to, especially if we’re building something bigger. Of course, when there’s money on the line, that choice becomes somewhat harder (see also: Careless People / Don’t Be Evil).These are good moments for some scenario planning about the consequences of different actions, but also what more creative solutions and approaches might exist beyond just ‘use AI / don’t’.Huge thanks to the amazing"
