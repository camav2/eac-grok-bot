                                                        - text: After 24 years as a Partner of Deloitte (and proudly the 2nd longest serving woman partner of Deloitte Australia) I have retired from our partnership and stepped into my next exciting chapter.I continued to provide Executive Coaching, Menopause Group Coaching and Leadership Workshops at Deloitte (consulting part-time).
