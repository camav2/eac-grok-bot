                                                  - generic:
                                                    - paragraph:
                                                      - generic:
                                                        - text: Karen assisted senior leaders in attaining their professional goals through solution-focused executive coaching. She was passionate about leadership effectiveness and strengthening their impact.She particularly valued coaching women leaders within Deloitte Australia and supporting their progression as established leaders in the firm. Karen designed, implemented, and delivered the Women Partner Coaching Program for Deloitte, coaching ~80 senior leaders annually for a decade.Karen was also co-leader of the Managing Menopause in the Workplace Working Committee and was instrumental in designing and facilitating education and support initiatives, including leading group coaching programs. Through this work, she played a key role in Deloitte becoming the first accredited Menopause Friendly Employer in Australia.
