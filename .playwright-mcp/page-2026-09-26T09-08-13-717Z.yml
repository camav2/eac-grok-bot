                                                                      - text: each week)I feel pretty chuffed that not too long ago I regarded myself as a non runner. Now in my late 50's I have built a new habit, am building a new skill and most importantly I am strengthening my bones and my heart (looking forward to my next Dexa scan!).As a postmenopausal woman I am conscious that I have agency in how I live my midlife. Choosing to run is a big part of it. It falls neatly into my 𝗠𝗶𝗱𝗹𝗶𝗳𝗲 𝗹𝗲𝗮𝗱𝗲𝗿𝘀𝗵𝗶𝗽 𝗺𝗼𝗱𝗲𝗹:⭐ it give me 𝗺𝗲𝗮𝗻𝗶𝗻𝗴 and shapes my 𝗶𝗱𝗲𝗻𝘁𝗶𝘁𝘆 as someone who can, rather than someone who watches from the side.⭐ I literally go the 𝗱𝗶𝘀𝘁𝗮𝗻𝗰𝗲 as I pace myself each week. ⭐ I'm 𝗹𝗲𝗮𝗿𝗻𝗶𝗻𝗴 how to better my running, altering my stance, pace, breathing, and particularly my mindset. My self talk, "You got this!" plays a vital part. ⭐ I'm taking it slowly, but know that each step 𝗶𝗻𝗰𝗿𝗲𝗺𝗲𝘁𝗮𝗹𝗹𝘆 moves me forward. ⭐ I've formed parkrun 𝗳𝗿𝗶𝗲𝗻𝗱𝘀𝗵𝗶𝗽𝘀 which connect me with others and provide a lovely sense of belonging to something bigger.⭐ And I feel 𝗲𝗻𝗴𝗮𝗴𝗲𝗱 and motivated to bring my best self each week. Just showing up is a win!Midlife is a stage of life which opens the path for the next stage. How you choose to live this time of life is yours to decide. I'm looking forward to receiving my commemorative ❤️ red
                                                                      - strong: parkrun Australia
                                                                      - text: t-shirt. We all know that red makes you go faster, so watch out as I'm heading for the next milestone! Be sure to bring the joy to the choices you make.How are you you leading yourself to live your best life midlife?
