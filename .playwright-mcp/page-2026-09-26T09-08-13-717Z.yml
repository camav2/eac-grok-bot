                                                        - generic:
                                                          - generic:
                                                            - generic:
                                                              - paragraph: Executive Coach (PCC) of Midlife Leaders ; Keynote Speaker ; Menopause Coach & Group Coach
                                                              - paragraph: Karen Stein
                                                          - paragraph: Jun 2024 - Present · 2 yrs 4 mos
                                                          - paragraph: Australia
                                                      - generic:
                                                        - paragraph:
                                                          - generic:
                                                            - text: "I work with experienced leaders and organisations to strengthen leadership through midlife, helping people sustain performance, navigate change and continue to grow.I bring 30+ years of leadership experience, with 24 years as a Deloitte Partner, and expertise as a certified PCC Executive Coach, coaching psychology, author and menopause specialist.Grounded in my award-winning book, ''Be Your Own Leadership Coach'', my 𝑴𝒊𝒅𝒍𝒊𝒇𝒆 𝑳𝒆𝒂𝒅𝒆𝒓𝒔𝒉𝒊𝒑 𝑺𝒆𝒓𝒊𝒆𝒔 provides practical, evidence-based self-coaching strategies that strengthen self-awareness, confidence, decision making and leadership impact.I deliver this through executive and group coaching, keynotes, and workshops.🟨 Midlife LeadershipMidlife can be one of the most valuable stages of a leadership career. Experience and capability are high, while questions about energy, identity, relevance, purpose and what comes next can become more important.I help leaders sustain their impact, navigate change, continue progressing or shape their next chapter.🔸𝑀𝑖𝑑𝑙𝑖𝑓𝑒 𝑀𝑜𝑚𝑒𝑛𝑡𝑢𝑚™ strengthens clarity, confidence and sustainable performance through midlife.🔸𝑀𝑖𝑑𝑙𝑖𝑓𝑒 𝑀𝑎𝑠𝑡𝑒𝑟𝑦™: 𝑇ℎ𝑒 𝑁𝑒𝑥𝑡 𝐶ℎ𝑎𝑝𝑡𝑒𝑟 supports experienced leaders transitioning beyond a significant role to redefine success and shape what comes next.🟨 Menopause in the WorkplaceAs a 𝐶𝑒𝑟𝑡𝑖𝑓𝑖𝑒𝑑 𝑀𝑒𝑛𝑜𝑝𝑎𝑢𝑠𝑒 𝐶𝑜𝑎𝑐ℎ and 𝑀𝑒𝑛𝑜𝑝𝑎𝑢𝑠𝑒 𝐶ℎ𝑎𝑚𝑝𝑖𝑜𝑛, I help organisations recognise menopause as a business, wellbeing and leadership issue.Through 🔸M.A.D about Menopause™: Making a difference at work, I build understanding, reduce stigma and help organisations create practical responses enabling women to remain confident, capable and connected to their careers. My keynotes, 1:1 & group coaching, and workshops move the workforce from awareness to meaningful action, strengthening inclusion and talent retention.Find out more at www.karensteincoaching.com"
