                                                                      - text: By midlife we’ve spent decades becoming good at what we do.We have experience, judgement, knowledge and plenty to draw upon from our virtual backpack. 🎒 But could all of that experience also make it easier to stop learning?That’s the question I explore in the latest edition of 𝐓𝐡𝐞 𝐌𝐢𝐝𝐥𝐢𝐟𝐞 𝐋𝐞𝐚𝐝𝐞𝐫𝐬𝐡𝐢𝐩 𝐒𝐞𝐫𝐢𝐞𝐬, where 𝐋 𝐬𝐭𝐚𝐧𝐝𝐬 𝐟𝐨𝐫 𝐋𝐞𝐚𝐫𝐧𝐢𝐧𝐠.I look at why learning matters differently for the midlife leader, and consider the value of becoming a beginner again, and keeping our leadership relevant as the world changes around us.𝑊ℎ𝑒𝑛 𝑑𝑖𝑑 𝑦𝑜𝑢 𝑙𝑎𝑠𝑡 𝑏𝑒𝑐𝑜𝑚𝑒 𝑎 𝑏𝑒𝑔𝑖𝑛𝑛𝑒𝑟 𝑎𝑡 𝑠𝑜𝑚𝑒𝑡ℎ𝑖𝑛𝑔?Read on below 👇
