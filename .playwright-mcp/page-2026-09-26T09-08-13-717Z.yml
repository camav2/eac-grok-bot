                                                                      - text: How small might your next move be? 🤔 At midlife we can become caught up in the big questions about what comes next.Yet progress doesn’t always require a big move.Sometimes it starts with one conversation, one experiment, one new skill, or one different choice.These can be small increments which take us somewhere meaningful.In this edition of The Midlife Leadership Series, I explore Increments and why our next move doesn’t need to be big to matter.What small move could you make next?Read on below 👇
