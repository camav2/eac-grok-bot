                                                  - generic:
                                                    - paragraph:
                                                      - generic:
                                                        - text: Karen advised Australian corporates, start-ups, and lifesciences organisations on securing funding to support innovation, research, and commercial growth. She worked with organisations to optimise R&D Tax Incentives and government grant programs aligned to strategic objectives, helping organisations navigate complex regulatory environments while maximising investment in innovation.Karen led national initiatives including Deloitte Tax’s Consumer Business & Transport industry group and the NSW Lifesciences R&D Tax practice. She was a regular industry presenter and contributed to consultations with regulators, industry, and corporates that informed the development of Australia’s R&D Tax Offset program.She also served on the Deloitte Tax Executive Leadership Team focusing on leadership effectiveness, coaching partners and designing development programs for senior leaders, alongside completing a Master of Science in Coaching Psychology.
