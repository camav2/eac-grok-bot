                      - strong [ref=f141e478]: Imagine a team starts using AI to help compare options before an important decision.
                      - text: Nothing on the org chart may change.But the work of deciding can.Who defines the question?Who decides which options deserve attention?Who is expected to challenge the recommendation?Who carries responsibility for the outcome?These questions become important when AI takes on more of the work around a decision while people’s formal roles stay the same.This is one of the organizational questions I’m currently studying.
