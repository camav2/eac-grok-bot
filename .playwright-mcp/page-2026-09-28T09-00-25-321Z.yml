                      - paragraph [ref=f73e283]: I help authors, founders and experts secure money-can't-buy media opportunities and connect with their ideal audience | Strategic PR consultant | Host of PR with Purpose podcast | Freelance writer
                      - paragraph [ref=f73e285]: 2h
