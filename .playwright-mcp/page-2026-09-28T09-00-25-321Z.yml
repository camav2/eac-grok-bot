                  - paragraph [ref=f73e292]:
                    - generic [ref=f73e293]:
                      - text: So this definitely wasn't on my bingo card for 2026... having an item of clothing named after me! Yes that's right, this is the 'Huckle' top from
                      - 'link "View company: Philosophy Australia" [ref=f73e296] [cursor=pointer]':
                        - /url: https://www.linkedin.com/company/philosophy-australia/
                        - strong [ref=f73e297]: Philosophy Australia
                      - text: . How did we get here? Let's rewind a little...Last year I sat next to the wonderful
                      - link "View Alison Lennard’s profile" [ref=f73e299] [cursor=pointer]:
                        - /url: https://www.linkedin.com/in/alison-lennard-philosophy-australia/
                        - strong [ref=f73e300]: Alison Lennard
                      - text: at dinner at the Accountability Circle Conference hosted by
                      - link "View Michelle Broadbent’s profile" [ref=f73e302] [cursor=pointer]:
                        - /url: https://www.linkedin.com/in/michellebroadbent/
                        - strong [ref=f73e303]: Michelle Broadbent
                      - text: in Manly, and learned about her amazing fashion label. It's part of the 3% Club - yes that's right, just 3% of the clothing we buy in Australia is actually made here, and Philosophy Australia is proudly part of this very exclusive club. Hearing from Ali about her passion for fashion, her commitment to slow, sustainable and ethical clothing and her belief in the power of small business, I was hooked on her story. When we did some PR work together later in the year, I had a story of my own to share... I'd gone into my own wardrobe and discovered I already owned a Philosophy Australia top! I'd actually purchased it from a local op shop, a beautiful white blouse that was still in perfect condition - a testament to the durability and craftsmanship that goes into every piece of Philosophy clothing.I showed Ali the top and she explained it was from a collection from a few years ago - but of course, still good as new. Which brings us to January 2026, when Ali told me she'd decided to bring a version of that same top back into the newest collection, and to name it after me! Then a few weeks ago I saw Ali at this year's Accountability Circle Conference and she presented me with my very own 'Huckle' top. Isn't it pretty? It's available now and already a bestseller!
                      - link "Open https://lnkd.in/g7QMVhze" [ref=f73e305] [cursor=pointer]:
                        - /url: https://www.linkedin.com/safety/go/?url=https%3A%2F%2Flnkd%2Ein%2Fg7QMVhze&urlhash=yR6w&mt=3sZJBhW_8j_eGnnkg8Vwr1Ugx6U7SpyU90SLdSTGNHg1A_kji6bwpZmuhvOiu3akWv92lxKwz2WfSV50od94uz3I5KhaC1hZfTZR7LP8gkelmMpwTYKKLRl3&isSdui=true
                        - strong [ref=f73e306]: https://lnkd.in/g7QMVhze
                      - text: If you want to ditch the wardrobe overwhelm, embrace slow fashion and buy items that last a lifetime (not a season), check out
                      - 'link "View company: Philosophy Australia" [ref=f73e308] [cursor=pointer]':
                        - /url: https://www.linkedin.com/company/philosophy-australia/
                        - strong [ref=f73e309]: Philosophy Australia
                      - text: .And THANK YOU Ali for being such a champion for slow fashion and small business - I feel lucky to know you.
