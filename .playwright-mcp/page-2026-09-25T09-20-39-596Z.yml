                    - generic [ref=f230e198]:
                      - text: Our lunchtime salon in Perth 🤩this week Wealth is moving into women's hands faster than the systems around them were built for. That's why capability and judgement matter now, not later. That was the starting point for a brilliant
                      - strong [ref=f230e199]: The Dea Network
                      - text: "lunchtime salon in Perth this week, with forty women who came curious, values-led, and willing to ask: what is my actual relationship with money? We spoke about the money patterns we inherit; who manages wealth in our family; who participates in stewardship decisions and who doesn't, and why. We talked about where we get our financial and investment information, whom we turn to when a big decision lands: an exit, a death, a divorce, a windfall. And we discussed what becomes possible if we capitalise on this moment. More women than any generation before will hold decision-making power over wealth. Not just ownership but agency. The confidence, the access, the community and the structures to direct where that capital goes. Perth carries its own version of this story: a city built on resources, mining, property, family business, private enterprise and philanthropy. The opportunity for women stewards has its own unique flavour and story. What struck me was the energy in the room, women of all ages, mothers and daughters speaking at tables, openly sharing, offering each other names, experience, and lessons. That's what a community can do, and that's what we're building with Dea. A place for women to explore identity, purpose and action through stewardship, and have a real say in where capital goes next. Perth, thank you for being a part of this journey with us. We look forward to more conversations with you and are excited that Dea is now in the West! We're very grateful to the team at"
                      - 'link "View company: Lipman Burgon" [ref=f230e201] [cursor=pointer]':
                        - /url: https://www.linkedin.com/company/lipman-burgon/
