                      - text: I ended a two-day leadership programme by handing a room of senior leaders an eye mask and asking them to do nothing 🖤To surrender and receive. To be, and to give thanks. To let their bodies integrate everything they had learned.Normally we close two days the same way. What is your key learning, what will you do in the next 90 days. Good questions. Everyone writes something down, and it wavers by Thursday as they fall back into the busy.So I experimented the other way round. Instead of asking them to take something away, I gave them something.Be. Receive. Give thanks. That was the whole intention.Eye masks on. No talking. Lying or sitting together. And Tara-Lee Byrne playing the cello, live in the room. A full body immersion.Partway through I lifted my mask and looked around, breathing in the moment. Goosebumps. Actual tingles.And then the emotion arrived all at once, because there it was. This is the thing I am meant to be doing. Honouring my own ambition while helping others find theirs.It has taken me years to arrive here, and I have arrived despite all of it.Here is what I keep thinking about since.High achievers are exceptional at doing. We are almost useless at receiving. Ask us to deliver and we will move mountains. Ask us to lie still and let something land, and we will fidget, or plan, or quietly work out what we should be doing instead.Your mind has been running the whole show. Your body has been carrying it without ever once being consulted.Letting the two of them be in the same place at the same time, with nothing required of either, is the thing almost none of us ever allow 🖤That is what I want to give people now, beyond the boardroom.So I am running a retreat in February, in Byron, my home town.A select group. A tight circle of people ready to do the deeper inner work and set themselves up for their best year yet.It will not be advertised widely. The waitlist goes first.Comment WAITLIST and I will pop you on the list.
