                  - paragraph [ref=f66e730]:
                    - generic [ref=f66e731]:
                      - text: "AI poses a massive risk to all of us.But the biggest risk isn’t that AI will take our jobs.And it isn’t that AI will destroy humanity.It’s much more mundane - and much more immediate.AI will make us lazy and stupid.The more we outsource our thinking to AI, the less thinking we end up doing ourselves.That’s the AI risk I think we should be talking about. I call it The Great BlandificationAI democratises competence but homogenises creativity.Everyone’s email has perfect grammarEveryone’s PowerPoint becomes polishedEveryone’s strategy document sounds amazing.Everything gets better. BUT everything starts sounding the same. I discuss this at length in my Lunch with the AFR. Thankfully, we didn’t spend the entire lunch discussing AI and cognitive surrender. That can really kill the mood over dessert 😃We also talked about:• The worst career advice in the world: “Follow your dream.” I’ve noticed this advice generally comes from people whose dreams worked out. If you have a dream, fantastic - give it a go. But if you don’t, find something you’re reasonably good at, learn to love it, and you might be surprised where it takes you.• What I think is the secret to Aaron Sorkin’s brilliant writing, which I learnt while working as a creative executive on the development of The West Wing.• Why I walked away from Hollywood and why I would happily take my worst day as a lawyer over my best day at Warner Bros. • Why I returned to stand-up after decades away. Basically, I decided the world had enough lawyers and not enough laughs. So I wrote The Accidental Lawyer. We also talk about Lawpath and the enormous satisfaction of seeing an idea grow into a business that has helped more than 650,000 clients.And how I survived 25 years as a law firm partner largely by giving up on trying to behave like my idea of a law firm partner and just being me - oddness and all.Which brings me to perhaps the most important point. I think one of the secrets to surviving AI is being more human, not less.Figure out what is uniquely you. What can you contribute that nobody else can quite replicate?AI can be a lot of things but it can’t be you.That, ultimately, is what The Accidental Lawyer is about. Lean into being you - as everyone else is taken. The winners in the AI-world will be those who resist The Great Blandification. And none of my accidental career would have happened without a great many people who backed me, challenged me, put up with me and pointed me in the right direction. You always need a team.Thanks to everyone who has been part of mine.And thanks to Lucy Dean for a wonderfully wide-ranging lunch and conversation - and to The Australian Financial Review for somehow turning my rather strange career into a coherent story.Full article at the link in the comments."
