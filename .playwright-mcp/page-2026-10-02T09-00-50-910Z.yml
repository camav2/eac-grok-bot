                      - strong [ref=f66e359]: What could we build together that none of us could build alone?
                      - text: Today, a group of Swiss Strengths Coaches came together — a rich time together with other brilliant coaches, co-hosted with
                      - link "View Daniela Rusu PCC, CPCC, MSc’s profile" [ref=f66e361] [cursor=pointer]:
