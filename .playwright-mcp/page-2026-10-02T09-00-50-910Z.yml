                        - strong [ref=f66e362]: Daniela Rusu PCC, CPCC, MSc
                      - text: ". One image stayed with me:"
                      - strong [ref=f66e363]: A cathedral.
                      - text: Cathedrals weren’t built by one person, with one skill or in one lifetime.They were built by many people, bringing different strengths to a shared vision. Some laid foundations. Some carved stone. Some created windows. Some imagined what did not yet exist. And together, they built something none of them could have created alone.It made us think about the power of
                      - strong [ref=f66e364]: strengths in partnership
                      - text: .When we understand what we naturally bring — and become curious about what others bring — our differences become something we can build with.And when we have a
                      - strong [ref=f66e365]: vision we can actually see
                      - text: ", it becomes easier to understand where our contribution might fit.Perhaps that is how legacy is built.Not simply:"
                      - strong [ref=f66e366]: What can I build?
                      - text: "But:"
                      - strong [ref=f66e367]: What can we build together?
                      - strong [ref=f66e368]: And what might become possible because each of us brought what we uniquely have?
                      - text: Today felt like another small stone being laid.And there is room for more builders.
