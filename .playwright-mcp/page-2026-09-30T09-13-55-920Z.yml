                    - paragraph [ref=f72e2817]:
                      - generic [ref=f72e2818]:
                        - strong [ref=f72e2819]: SOMETIMES LIFE TEACHES YOU THROUGH CAKE. 🎂❤️
                        - text: "I’ve spent a large part of my life collecting notes.Notes from work.Notes from mistakes.Notes from people.And perhaps some of the most important notes came simply from living in different places on this wonderfully small planet. 🌍Because every culture teaches you something.About family.About generosity.About belonging.About how we show someone:"
                        - strong [ref=f72e2821]: “You matter to me.”
                        - text: My girlfriend, Preeya, is from Thailand and runs a wellness center here in the Netherlands.Yesterday, her colleague Dazz — who loves cooking and baking — suddenly called me.“I'm coming to the wellness center in 30 minutes. Can you come?”No explanation.Slightly suspicious...in Holland things are normally planned one month ahead 😂So I went.And there she was with this beautiful birthday cake she had made for me. 🎂“I have to give it to you now,” she said, “because you weren't here for your birthday two weeks ago.”That sentence got me.Because this wasn’t really about cake.It was about remembering.Thinking about someone when they aren’t there.And then doing something about it.❤️Over the years, spending time with people from Thailand and other parts of Asia has taught me a lot about warmth, hospitality and generosity.I’m careful about generalising cultures — there are warm people everywhere and cold people everywhere.But in
                        - strong [ref=f72e2822]: my own experience
                        - text: ", I have often encountered a beautiful instinct in many Asian cultures to express care through actions.Food appears.Something gets cooked.Something gets brought.Someone remembers.Nobody writes a leadership strategy about it.They just do it. 😂❤️I grew up somewhat further north on this little planet.Let’s just say Scandinavian emotional central heating occasionally takes a while to warm the house. 😂❄️But living among different cultures has cultivated me.Some people have taught me courage.Some curiosity.Some patience.And some have taught me simply to be"
                        - strong [ref=f72e2823]: warmer
                        - text: .Maybe that is one of the greatest gifts of travelling, living abroad and allowing people unlike ourselves into our lives.We don’t just discover other cultures.
                        - strong [ref=f72e2824]: We let them change our own.
                        - text: Thank you, Dazz.The cake was beautiful.But the gesture tasted even better. ❤️🎂And that is another little note from life worth keeping.🎵
                        - strong [ref=f72e2825]: Life Set to Notes
                        - text: Because sometimes the smallest gestures leave the longest echoes.
