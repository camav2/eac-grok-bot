                          - strong [ref=f72e3097]: Reykjavík Global Forum
                        - text: "2025, we have an “upgrade” problem: women are not advancing through organizations at the same rate at which they enter them. And even when women reach the C-suite, they are not always in the roles that traditionally provide the most direct pathway to running the organization.This distinction matters because representation alone does not tell us where decision-making authority, influence, and ultimately power reside.If we want to understand progress for women in leadership, we need to look beyond who enters the organization and ask: Who advances? Into which roles? And who ultimately has the opportunity to lead?I look forward to participating in this year’s Reykjavik Global Forum and continuing these important conversations about women’s leadership and advancement."
