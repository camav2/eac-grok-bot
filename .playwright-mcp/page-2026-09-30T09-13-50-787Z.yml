                      - text: conference to an audience of some of country's leading financial advisors.I ran a 90 minute personal branding masterclass day 1 and delivered the closing keynote day 2. It was the first time I have delivered two presentations at the same conference to the same audience. It only occurred to me on the flight over that it could be a recipe for disaster if day 1 didn't go to plan. Lucky my fears were not founded.Both days the messaging centred around one important point - visibility and consistency builds trust. Personal branding has very little to do with self promotion and everything to do with human connection (and communication). One exercise I had the audience do for fun was to partner up, ask AI to review their partners LinkedIn profile and sum it up as if it were a car model then explain why. I was impressed to discover there were a lot of high end Volvo's in the room (you will be happy to know
