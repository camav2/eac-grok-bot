                      - text: Today, What Could Possibly Go Right? is officially out in the world.Writing this book gave me the chance to look back at nearly four decades of building, leading, taking risks, getting things wrong, and trying again. Some of the most important lessons came from the moments that didn’t go according to plan. Others came from the extraordinary people I’ve had the privilege to work alongside.I wrote this for anyone building something they care deeply about, navigating change, learning when to hold on and when to let go, and trying to create a culture where people feel they belong.More than anything, I hope it encourages you to keep betting on possibility.What Could Possibly Go Right? is available now wherever books are sold. I hope you’ll read it, and I can’t wait to hear what you think.Danny
