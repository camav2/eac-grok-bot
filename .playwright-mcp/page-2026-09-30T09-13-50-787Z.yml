                  - paragraph [ref=f72e1565]:
                    - generic [ref=f72e1566]:
                      - text: "𝗜 𝗺𝗮𝗱𝗲 𝗮 𝗺𝗶𝘀𝘁𝗮𝗸𝗲 𝗶𝗻 𝗮 𝗿𝗲𝗰𝗲𝗻𝘁 𝗽𝗿𝗼𝗽𝗼𝘀𝗮𝗹 (frustrating) 𝘀𝗼𝗺𝗲𝘁𝗵𝗶𝗻𝗴 𝘁𝗵𝗮𝘁 𝗜 𝗿𝗲𝗴𝘂𝗹𝗮𝗿𝗹𝘆 𝗮𝗱𝘃𝗶𝘀𝗲 𝗺𝘆 𝗼𝘄𝗻 𝗰𝗹𝗶𝗲𝗻𝘁𝘀 𝗻𝗼𝘁 𝘁𝗼 𝗺𝗮𝗸𝗲 (embarrassing).Several weeks ago I met with the two principals of an engineering firm working with automation technology in manufacturing. I would love to work with them, and I left the meeting feeling excited. They are clever, interesting people, and I could see plenty of opportunities to help them strengthen the commercial side and to help grow their practice.They could see it too and they told me they knew they needed the help and wanted to work together.Because I know that the success rate of proposal submitted within the first 48 hours, I went to work and ended up creating something that I was proud of. My proposal was thoughtful, highly personalised and designed around the prospective client’s cash-flow constraints. It clearly explained the engagement, the process and what they could expect. I even created a 𝙙𝙞𝙜𝙞𝙩𝙖𝙡 offer page (password protected, not indexable) with a walkthrough video.Sadly, the offer did not convert... 🤨 So today, now that a few weeks have passed, I went back to review the whole proposal (video, digital offer page, commercial terms, etc.) --> 𝒉𝒐𝒕 𝒕𝒊𝒑: 𝒅𝒐 𝒕𝒉𝒊𝒔 𝒘𝒊𝒕𝒉 𝒍𝒐𝒔𝒕 𝒅𝒆𝒂𝒍𝒔.The proposal explained:✔️ What we would do✔️ How we would work together✔️ When we would meet✔️ What the commercial terms would be✔️ How the engagement would accommodate their circumstances...all of that mattered.But I hadn’t made sufficiently clear: ❌ What would become commercially different for them ❌ How that change could improve their financial positionWhat the expected transformation looked like ❌ Why the investment made sense now ❌ What evidence supported my confidence in the outcomeMy proposal read like a detailed consulting scope rather than a compelling sales proposition...I had left the buyer to infer the value (d'oh - insert Homer Simpson gif here)This is exactly the kind of thing I help clients avoid.I advise consultants and technical experts on commercial positioning, offer design and negotiation. I’m pretty damn good at identifying these issues in other people’s businesses....but inside my own work, I fell into the same trap (insert old man shakes fist at cloud gif).A proposal is 𝙣𝙤𝙩 complete when it explains the work. It is complete when the buyer can 𝒄𝒍𝒆𝒂𝒓𝒍𝒚 see value of investing in you to their business and the commercial cost of doing nothing."
