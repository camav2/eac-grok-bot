                        - generic [ref=f65e2098]:
                          - generic [ref=f65e2099]: "I've lost count of the number of times I've heard about a team that is busy, and I mean genuinely busy, and still, somehow, nothing is moving.The calendar is full, the inbox is full, the meetings are full, and at the end of the week nobody can quite point to what actually got decided or built.People work hard on things that were never clear enough to finish, so they default to activity because it feels safer than asking the question that would actually unstick the work.Productivity or work ethic is not the problem. It comes down to clarity.If you're ready to stop rewarding busy and start building teams that actually move, the Productive Leaders program is built for that. It rethinks the relationship between productivity and leadership, so you're not managing effort, you're creating the conditions for real progress. Send me a message and we'll talk it through.**********Hi, I'm Donna McGeorge, based in Geelong, and I've spent decades helping leaders and teams get to the heart of what actually makes work productive. These days that means rethinking productivity altogether: the real issue in most organisations isn't a shortage of hacks, it's a shortage of trust, clarity, and good decision-making, and that's the conversation I bring into every room I work in.If you'd like to be part of that conversation, here's where to start:* Subscribe to my newsletter here on LinkedIn via my profile* Message me about in-house training and keynote speaking"
