                          - generic [ref=f65e2516]: "In almost every session I run, someone in the room admits (accidentally or otherwise) they've been managing their team by watching for effort rather than trusting outcomes.Trust changes how people use their time. When someone knows they don't have to perform busyness for an audience, they stop protecting how the work looks and start focusing on whether it actually moves forward.**********Hi, I'm Donna McGeorge, based in Geelong, and I've spent decades helping leaders and teams get to the heart of what actually makes work productive. These days that means rethinking productivity altogether: the real issue in most organisations isn't a shortage of hacks, it's a shortage of trust, clarity, and good decision-making, and that's the conversation I bring into every room I work in.If you'd like to be part of that conversation, here's where to start:* Subscribe to my newsletter here on LinkedIn via my profile* Message me about in-house training and keynote speaking"
