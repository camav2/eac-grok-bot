                        - generic [ref=f65e2411]:
                          - generic [ref=f65e2412]: "It's almost tragic what happens to a team's week once trust goes missing. Checking and reporting multiply, meetings appear to demonstrate progress rather than make it, and somewhere underneath all that noise, the real work stalls.I see this constantly in the rooms I work in, and it's rarely a motivation or even a productivity problem. It's a conditions problem.The real question for leaders isn't how to extract more effort from people who are already stretched; it's how to create the right conditions of trust so that people can get on with it.**********Hi, I'm Donna McGeorge, based in Geelong, and I've spent decades helping leaders and teams get to the heart of what actually makes work productive. These days that means rethinking productivity altogether: the real issue in most organisations isn't a shortage of hacks, it's a shortage of trust, clarity, and good decision-making, and that's the conversation I bring into every room I work in.If you'd like to be part of that conversation, here's where to start:* Subscribe to my newsletter here on LinkedIn via my profile* Message me about in-house training and keynote speaking"
