                        - generic [ref=f65e2745]:
                          - generic [ref=f65e2746]: "I've been ploughing through Bluey on the ABC iview app while on the treadmill. And yes, I'm VERY late to the party.I knew enough about the show to write a decent paragraph or two on it in my last book, but there's a massive difference between skimming enough episodes to sound clever in a book and actually sitting through the lot back to back, treadmill going nowhere, laughing out loud at a cartoon dog.Seven minutes an episode, no villain, no laser beams, just Bingo and Bluey (and usually Bandit) making up a game in the backyard, drawn in flat, simple colour with none of the flashy, overworked animation you get everywhere else on kids' telly these days.Somehow every single episode manages to nail one true thing, whether that's being absolutely knackered or being six and losing the plot over bedtime, and it does only that, properly, instead of trying to cram in a lesson on maths and manners while it's at it.I know you are waiting for the . . . and this reminds of B2B sales in that . . . AND I write books about doing less, and there's a dog family from Brisbane doing it better than most of us manage with a whiteboard and a full day of meetings.Image: ABC iView"
