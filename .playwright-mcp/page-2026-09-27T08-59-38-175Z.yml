                          - generic [ref=f65e3284]: A habit doesn't start as a habit, it starts as a rule.Rules are blunt, like the 6am alarm or the no-phone-before-breakfast kind of thing, and there's no feeling attached to them at all, just a line you've drawn that you're either on the right side of or you're not.Somewhere between that rule and the actual habit, there's a stage most people walk straight past without noticing, and it's the bit that decides whether the whole thing sticks or falls over in a fortnight.
