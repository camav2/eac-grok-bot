                              - generic [ref=f65e1429]:
                                - text: When work feels overwhelming, our instinct is often to add something.Perhaps another system, or hold another meeting, or … shall we introduce another productivity tool? And that’s yet another item on the ever increasing list. However what if the better question is, “What can I remove?” In my latest episode of Your Career Podcast (epf285), I speak with productivity expert and bestselling author,
                                - link "Donna McGeorge" [ref=f65e1431]:
                                  - /url: /in/donnamcgeorge/
                                - text: ", about her book, Red Brick Thinking, and the value of strategic subtraction. Donna explains that many productivity problems are not about poor time management but are often the result of overcommitment, unclear priorities, excessive meetings and difficulty delegating. We also discuss: · Why capable professionals continue saying yes when they are already stretched · How our beliefs about work, responsibility and perfectionism influence the way we use our time · Why clear boundaries are essential for protecting our attention and capacity · The importance of regularly reviewing what no longer belongs in our work or career This idea is particularly relevant for job seekers during a career transition. We often focus on what we need to add: new skills, more contacts, another qualification or a longer list of achievements when, to be honest, progress begins by stopping for a minute, and looking at what is THE most important thing and probably letting go of some of the things on that long ‘to do’ list. It could be an outdated expectation, a responsibility that no longer fits, a project that has reached the end of its useful life or, perhaps, the belief that we must do everything ourselves. Donna’s career story is equally fascinating, from her early ambition to become a coroner, (yes, that’s a big change from where she is today!) to building a highly successful career as an author, speaker and productivity specialist. Listen to our conversation on Your Career Podcast with Jane Jackson and consider: What might become possible if you stopped adding and started subtracting?Share your productivity tips in the comments. Listen to the full episode now:"
