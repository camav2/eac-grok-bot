                          - generic [ref=f65e3176]: "Locals call it Pako and I know the north end best with the cafes and restaurants I've come to rely on. Oh, and my hairdresser is tucked in there somewhere too, and I reckon it's one of the best strips in Geelong if not, Victoria.What I haven't done properly yet is the other end, down towards Newtown, the bit some people call the posh end and others call the Melbourne end. Same street with a different energy entirely, and I'm keen to actually walk it properly instead of just driving past on my way somewhere else.If you're a G-Town local (see what I did there with the lingo) do you have a fave spot for coffee, tea, food, or any other shopping on Pako? Hook me up.**********Hi, I'm Donna McGeorge, based in Geelong, and I've spent decades helping leaders and teams get to the heart of what actually makes work productive. These days that means rethinking productivity altogether: the real issue in most organisations isn't a shortage of hacks, it's a shortage of trust, clarity, and good decision-making, and that's the conversation I bring into every room I work in.If you'd like to be part of that conversation, here's where to start:* Subscribe to my newsletter here on LinkedIn via my profile* Message me about in-house training and keynote speaking"
