                      - text: Everyone says strength is never breaking. That's wrong.The strongest people I know have broken. More than once.What makes them strong is what they did next.That's what STRENGTH is about at our next Stories That Stir Brisbane.Six storytellers. Six titles that already say so much:1️⃣ Struggles & Triumphs2️⃣ Trauma Transformed3️⃣ Decision Point4️⃣ Heavyweight5️⃣ The Pail6️⃣ Let GoNo slides. No scripts. Just real people telling the truth.You'll leave with something most events can't give you. Permission to see your own hard moments as proof of strength, not weakness.🗓 Sun 1 Nov, 2pm to 4.30pm📍
