                          - generic [ref=f50e697]:
                            - text: My startup world and my workplace inclusion world collided, in the best way, at the Spark Festival 2026 Opening Celebration.I got to exhibit
                            - link "Understanding Zoe" [ref=f50e698] [cursor=pointer]:
                              - /url: https://www.linkedin.com/company/understandingzoe/
                            - text: as part of my time with the
                            - link "University of Technology Sydney" [ref=f50e701] [cursor=pointer]:
                              - /url: https://www.linkedin.com/company/university-of-technology-sydney/
                            - text: Startup Hub, an opportunity that came off the back of winning the AI Award for Global Social Impact in New South Wales, which also scored us three months free at their co-working space.
                            - link "Nisrine Omari" [ref=f50e705] [cursor=pointer]:
                              - /url: /in/nisrine-omari/
                            - text: and
                            - link "Jade Diep 叶翠瑩" [ref=f50e707] [cursor=pointer]:
                              - /url: /in/jadediep/
                            - text: (visiting from the US and the founder of Doctor Glitter, a dear friend of mine) helped me set up the booth and stayed with me for the evening. It was such a lovely reminder of why I do this work, getting to meet people who immediately understood the impact Understanding Zoe can have, fielding questions, and doing my fair share of pitching.I met people from government, fellow startup founders, and even ran into an old friend,
                            - link "Dr. Julien Marchand" [ref=f50e709] [cursor=pointer]:
                              - /url: /in/marchandjulien/
                            - text: ", who did his PhD on entrepreneurship and now teaches it at UTS. Hadn't seen him in years. Small world.Grateful for spaces like Spark that connect founders doing meaningful work, and proud to have been part of launching the"
                            - link "Spark Foundation" [ref=f50e710] [cursor=pointer]:
                              - /url: https://www.linkedin.com/company/spark-festival/
                            - text: "'s story."
