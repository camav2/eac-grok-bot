                          - generic [ref=f50e826]:
                            - text: What does it look like to work a weekend?Last Saturday we were had a stall for
                            - link "Understanding Zoe" [ref=f50e827] [cursor=pointer]:
                              - /url: https://www.linkedin.com/company/understandingzoe/
                            - text: at Carer Gateway's Learning NDIS Day, and being invited to speak about my own lived experience navigating the NDIS as a parent.I stood up and shared my story. All of it. The rawness of a broken system, the confusion, the exhaustion, the moments I didn't think I could keep advocating.What made it so special was looking out at a room full of people who were either starting that same journey or deep in the middle of it. I made people cry. I made people laugh. And afterwards, so many came up to tell me it was the most authentic talk they'd heard, thanking me not just for my vulnerability, but for building something that actually helps... a way to prepare for plan reviews, gather evidence of day to day life, and draft impact statements that reflect reality.That's the part that means the most to me. Taking the wounds of my own broken experience and turning them into something that becomes part of the solution for someone else.It was a privilege to share the day with so many others working to make this system easier to navigate, including the speakers Ben Morelli (NDIA Presentation),
                            - link "James Price" [ref=f50e831] [cursor=pointer]:
                              - /url: /in/james-price-51758236/
                            - text: (
                            - link "AIIM Choices Plan Managers" [ref=f50e832] [cursor=pointer]:
                              - /url: https://www.linkedin.com/company/aiimchoicesplanmanagers/
                            - text: ),
                            - link "Louise Swar" [ref=f50e836] [cursor=pointer]:
                              - /url: /in/louiseswar/
                            - text: (
                            - link "MyCareSpace" [ref=f50e837] [cursor=pointer]:
                              - /url: https://www.linkedin.com/company/mycarespace/
                            - text: ), and
                            - link "Mandy Vandertouw" [ref=f50e841] [cursor=pointer]:
                              - /url: /in/mandy-vandertouw-54b509157/
                            - text: (Advocacy, Rights & Safeguards).Huge thank you to Carer Gateway, and especially to
                            - link "Diana Kraljevski" [ref=f50e843] [cursor=pointer]:
                              - /url: /in/dianakraljevski/
                            - text: (Peer Support Coordinator, Carer Gateway/
                            - link "The Benevolent Society" [ref=f50e844] [cursor=pointer]:
                              - /url: https://www.linkedin.com/company/the-benevolent-society/
                            - text: ) for the invitation, along with Bella for helping organise the day.I got to meet so many incredible humans that day, people who can now be supported through Understanding Zoe. If this resonates with you or your family's NDIS journey, I'd love to hear from you.And to
                            - link "Nisrine Omari" [ref=f50e848] [cursor=pointer]:
                              - /url: /in/nisrine-omari/
                            - text: "for working with me (I will introduce her properly to everyone later this week)!!P.s I just received this email from the team and wanted to share this in the post: \"We have received a lot of positive feedback from participants and are grateful for the important role you played in making the event memorable.‘Great event loads of information just hope I can action what I’ve learned feeling a little overwhelmed at the moment but in a good way so many thoughts’‘The guest speakers were informative and interesting. Laetitia from Understanding Zoe was amazing, she made me cry, I think she was just so relatable. What a great mum and advocate for anyone with disabilities.’\"Now I am crying 😭🩵!!"
