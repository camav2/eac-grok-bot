                      - paragraph [ref=f62e810]:
                        - generic [ref=f62e811]:
                          - text: A little bit of exciting news to share… 📚I found out yesterday that It’s Not You, It’s Perimenopause has been named a finalist in the 2026 ABLE Book Awards!When I wrote this book, my goal was to make the science of perimenopause easier to understand and, importantly, more practical — bringing together my experience as a pharmacist, nutritionist and menopause practitioner to help women feel better informed and more confident navigating this stage of life.So to have the book recognised in this way feels incredibly special.I’m also really looking forward to the awards event in October and having the opportunity to meet and celebrate with the other finalists and authors. One of the unexpected joys of becoming an author has been connecting with so many people who are passionate about sharing knowledge, stories and ideas that can make a difference.Very proud to see It’s Not You, It’s Perimenopause amongst them. 💛
