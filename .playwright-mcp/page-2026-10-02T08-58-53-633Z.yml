                          - /url: https://www.linkedin.com/in/ronit-fazekas-30345249/
                          - strong [ref=f53e2039]: Ronit Fazekas
                        - text: for the encouragement)My trial run beforehand was honestly pretty lacklustre. Not exactly a sign of natural talent.So when the main event started, I felt I had to dig deep.And somewhere between the first tiger, the fifth butterfly, and the endless line of excited victims, I surprised myself, particularly at how much fun I had.It got me thinking about writing too.So many of us approach the page like we have to be brilliant immediately. Clear, polished, impressive, publishable.But that pressure squeezes the life out of the work before it’s even begun.At the
                        - 'link "View company: Expert Author Community" [ref=f53e2041] [cursor=pointer]':
                          - /url: https://www.linkedin.com/company/expert-author-community/
                          - strong [ref=f53e2042]: Expert Author Community
                        - text: ", we talk a lot about structure, strategy and commercial clarity. BUT PLAY MATTERS JUST AS MUCH TOO!Because play helps an author find their voice....It destroys perfectionism....It gives you permission to try before you know....It turns writing from performance back into discovery.Sometimes play asks you to be bad at something first.Sometimes the thing that feels awkward, silly, or out of character is exactly the thing that wakes you up.Maybe that’s true at the fair.And maybe it’s true on the page too.More play in the process. Better tigers on the face, writing on the page, [or insert whatever your thing is].Tagging (and thanking)"
