                          - strong [ref=f53e2032]: Ben Crowe
                        - text: "'s book, Where the Light Gets In (amazing BTW), and thinking about the role of play - something we really need more of.So when the village fair came up and the options for volunteering were manning the BBQ… or trying face painting… the BBQ just didn’t feel right.I decided to challenge myself. (Ping"
                        - link "View Tim Duggan’s profile" [ref=f53e2035] [cursor=pointer]:
