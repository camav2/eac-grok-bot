                      - generic [ref=f53e625]:
                        - text: Writing is naturally an iterative process, and we can see how our environment has shaped it - like when typewriters gave way to word processors, and self-publishing gave a way in to so many fringe authors. AI is the next great shaping, so I think it's an important conversation, and one I know a lot of people have questions and concerns about.Do we ignore it? Do we use it? If so, how? I discussed this at length this with
                        - link "View Justine Sloane-Lees’ profile" [ref=f53e627] [cursor=pointer]:
