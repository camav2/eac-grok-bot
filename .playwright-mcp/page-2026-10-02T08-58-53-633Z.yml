                          - strong [ref=f53e2407]: Bee Lim, Ph.D.
                        - text: at the Museum of Chinese Australian History, as she launched Welcome Home 🎈It felt quietly significant ...I first met Bee when she joined the
                        - 'link "View company: Expert Author Community" [ref=f53e2410] [cursor=pointer]':
                          - /url: https://www.linkedin.com/company/expert-author-community/
                          - strong [ref=f53e2411]: Expert Author Community
                        - text: to bring this book into the world. Bee was assigned to the pod I mentored based on the alignment in our work of intergenerational fractures with cultural depth.From early manuscript to beta reading to publication, I had the privilege of witnessing Welcome Home become a reality.Welcome Home is a unique, beautifully illustrated and articulated gift of possibility.It is therapeutically grounded, presents the interplay of our internal parts in an emotionally accessible way, informed by contemporary thinking and lived client experience. The reader is invited to sit with complexity, to honour every internal part, especially those silenced, shamed or misunderstood, and to explore with hope a return to wholeness.Standing in that room, I was reminded of my own journey bringing HUSH into the world:➡️ When we publish work shaped by inheritance, secrecy or survival, we are not simply sharing ideas.We are stepping into visibility after silence.We are allowing what was once privately carried to become publicly voiced.That is no small act.➡️ The Expert Author Community led by
                        - link "View Kelly Irving’s profile" [ref=f53e2413] [cursor=pointer]:
                          - /url: https://www.linkedin.com/in/kelly-irving/
                          - strong [ref=f53e2414]: Kelly Irving
                        - text: creates space for perspectives like this to be refined rather than diluted.So to anyone quietly holding a manuscript of depth, perhaps shaped by lineage, rupture or complexity:There is room for your voice.And this community is capable of holding it. Ask me how ⬇️ Join Us!
