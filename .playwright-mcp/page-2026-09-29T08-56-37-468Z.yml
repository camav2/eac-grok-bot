                          - generic [ref=f111e504]:
                            - text: "Some people don't believe Generalists exist. And I get it. Ubiquitous yet invisible, Generalists and the word itself have been more default than definition: see Jack of All Trades.But here's the thing. Over 50% of 36,000 folks surveyed in OC Tanner's 2023 annual trend reported being Generalists. That, and the increasing recognition that Generalists are different from those who specialize and even from each other. Generalists take a lateral approach, bringing a ranging curiosity and a creative approach to problem-solving. Inherently adaptive, Generalists are experts in practice, partnering with experts in everything else."
                            - link "Brad Smith" [ref=f111e506] [cursor=pointer]:
                              - /url: /in/bradsmi/
                            - text: ", CEO of #Microsoft, discussed AI's impact on workers in a conversation with the WSJ last week. And what excites him most? The resurgence of the Generalists, \"the person who can go solve specific problems with the help of AI…can take more initiative, apply judgment, be creative, have more of an impact.” Microsoft is changing how it hires and trains, including reintroducing a cohort-based rotation system so employees gain more exposure to different issues and ways of working. (I write about GE's rotation practice in Chapter 2 of my book).What are your thoughts on the article and conversation? Link to WSJ below and shout out to"
                            - link "Sue Dahling Sullivan" [ref=f111e508] [cursor=pointer]:
                              - /url: /in/sue-dahling-sullivan-4477995/
                            - text: ", the OG (Original Generalist!) who brought it to my attention."
