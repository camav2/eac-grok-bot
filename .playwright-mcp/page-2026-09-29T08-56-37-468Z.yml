                                - text: 🫠 "So what do you actually do?"Every Chief of Staff I know has a version of this question they dread.They know what they do every day. Answering "I do everything" just isn't a great way to keep a conversation going.📦 For years I tried to fix this by squeezing myself into a specialist box.Every job description wanted deep expertise in one thing and I kept trying to mold myself to fit.It never worked, because a generalist will never win against a specialist on resume skills alone.🔑 It wasn't until I became a Chief of Staff that being wide instead of deep finally felt like the point.In the hundreds of Career Chats I've done with aspiring Chiefs of Staff, the ones who struggle to explain their value all make the same mistake:❌ They describe their skills.✅ The ones who land the role describe what it's like to *work with them*.Here's the 3️⃣-line Mad Libs I learned from
                                - link "Siobhán O'Riordan" [ref=f111e641]:
                                  - /url: /in/saoriordan/
                                - text: "to communicate your value as a Chief of Staff ⬇️1️⃣ I'm a Chief of Staff who excels at supporting leaders who need ______.→ A translator. A closer. Someone who can see the gap before they do.2️⃣ What I bring is ______.→ Strengths, not skills. The adjectives people keep using about you, not the tools on your resume.3️⃣ I'm at my best when ______.→ The environment where you thrive. Almost always this comes down to autonomy and trust.Put together, it sounds like:\"I excel at supporting leaders who need a translator. I read between the lines and build trust fast. I'm at my best when I can ideate solutions and build the relationships to get them done.\"💡 Homework: ask 5️⃣ people you've worked with for three adjectives that describe you and one example of when it was true.You'll get the same words back over and over.Those words are your line 2️⃣.💾 Save this for the next time someone asks what you actually do."
