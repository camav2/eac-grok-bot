                                        - text: – Lisbon 🇵🇹It’s a wrap here and it left me with powerful reflections:The stark reality of sexual abuse onboard. The statistics shared were deeply concerning and how we should respond and create a safe space onboard.We also explored how to create relevant training activites that covers the current and emerging threats — from political activism to migration-related situations such as “avión patera.”A key takeaway for me was the role of Situational Awareness in managing disruptive and unruly passengers. Frontline employees must be equipped not just with procedures, but with judgment. There is a critical point where a passenger ceases to be “a customer” and becomes a safety risk. Knowing where to draw that line — confidently and lawfully — protects everyone onboard.Safety is not only about aircraft and operations. It is about people.Grateful for the meaningful exchanges and the inspiring individuals I met. Special thanks to
