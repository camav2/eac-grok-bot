                                                          - text: "srsly, I was thinking the other day about how from 2008 every hackaton or ideation session I ran/saw basically resulted in app after app after app. And now it's the same, but app = chatbot or other GenAI 'solution'.In corporate contexts, the app/chatbots are almost always trying to solve shitty systems that make people want to claw their eyes out every week (see: timesheets / expenses). In other contexts, people are almost always trying to tackle big societal problems, like loneliness. And call me old fashioned, but I just don't think an app/chatbot is going to solve those. And (hear me out) maybe it also means that maybe 'solving loneliness' and the like aren't something to be commercialised, but is something we should all be doing (wait for it)... for free???/rant"
