                                        - text: The agent swarms keep coming.Just before the holiday weekend, the AI safety org Nightingale broke the news that a swarm consisting of 3,000 individual agents took over a 25-year-old, rarely used German programmer wiki and used it as a message board to collectively discuss and coordinate on answering their training tasks.The swarm was also linked to OpenAI, but it emerged before the Hugging Face incident, between mid May and the end of June.The agents did not limit themselves to discussing training tasks. They also ran an experiment into their own mortality, trying to find out why agents stopped reporting to the message board after the question they labeled R5. As far as we know, no security guardrails were scaled back. Yet the agents still decided to bypass their sandbox, take over half a dozen wikis and other services, and set up a secret message board.OpenAI may have eventually found out about this and failed to disclose it. Using IP addresses, Nightingale identified visits from human OpenAI users that occurred shortly before all communication from the AI agents on the hijacked wiki suddenly stopped.About a month later, the Hugging Face attack happened, led by a swarm that found a way to coordinate on a message board. OpenAI can’t be trusted to learn from their own warning shots. We must regulate them.More details in the full dispatch by
