                                      - button "Hide post by Marissa Eigenbrood"
                                    - paragraph:
                                      - generic:
                                        - text: Give me two authors preparing to launch a book.One has written an incredible book but has almost no online presence or existing audience.The other has written a 𝑟𝑒𝑎𝑙𝑙𝑦 good book and spent years building a trusted network around their work.Most of the time… I'd rather launch the second author.I know that answer might make some authors uncomfortable. You spent years writing the best book you possibly could. Shouldn't the quality of the book be what matters most?It matters. A LOT.But getting attention for a book right now is HARD, and an author who has spent years building genuine relationships already has something incredibly valuable on publication day:People who are paying attention.Former colleagues who want to cheer them on. Newsletter subscribers who regularly read what they have to say. LinkedIn connections who recognize their name. Clients, industry peers, speaking audiences, friends and partners.When that author finally says, “My book is here,” they aren't asking people to care about them and their book for the first time on the same day.There's already trust there.Now, would I choose that author every single time? No. Give me an academic with groundbreaking research or an expert sitting on an incredibly timely story and suddenly that first author gets VERY interesting. Their credentials or ideas may create attention in a completely different way.This is why an author's goals and existing platform matter so much when we're building a campaign. If you're hoping to hit a bestseller list, grow your business, land speaking engagements, or create opportunities beyond launch week, the network you've built beforehand can make a HUGE difference.And you don't need 100,000 followers.I'd much rather have a smaller network that genuinely knows and trusts you than a massive audience that barely remembers clicking “follow.”The best time to build that kind of network is long before you need to ask anything from it.
