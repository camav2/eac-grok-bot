                                    - paragraph:
                                      - generic:
                                        - text: "Your job as a non-fiction author: zero in, fill the gapsMany non-fiction books try to be everything to everyone. Every lesson, every tip, every scrap of research crammed in, as though the reader has a zillion problems AND the capacity to take in the information - and act! - on all of them.Me? I choose to read more books because of their specificity, rather than their breadth.In Look-It's Your Book! I write about finding and drilling down into your non-fiction niche. For example: Gluten free … vegan … Italian … dinners.And in the case of Look-It's Your Book!, I didn’t write it for every author out there, it was very specifically written for Australian … non-fiction writers … who were interested in the business … and how-to of self-publishing. Sure, I could have written it for ‘everyone’, but then it wouldn’t have had the depth or perspective to be as useful as it is.That’s why it was great to meet career services specialist and first-time author"
