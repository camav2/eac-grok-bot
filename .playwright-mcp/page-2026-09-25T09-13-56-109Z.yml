                                    - paragraph:
                                      - generic:
                                        - text: "If you've published a book, it's worth asking: what else could it become? An illustrated edition, an added non-fiction layer, a cover aimed at a different readership?In the latest Self Publishing with ALLi podcast I speak with internationally-renowned glass artist Mark Eliott who wrote his novel 'Essence of Cloud' alongside his art exhibition, with each shaping the other. It's a fascinating look at craft, art and creativity...and how books and ideas can evolve.This year his novel has a second life as a special edition ebook. Every artwork from the exhibition now sits beside the relevant passage in the novel. There's new non-fiction material too: a brief history of glassblowing and Mark's tips for working with borosilicate glass. Detailed accessibility descriptions capture each piece, its materials and its collaborators. And a new cover featuring his cast glass artwork 'The Mothership' opens the book up to art collectors and glassblowers as well as fiction readers.Same story. New format, new content, new audiences.Links in the email below. Have you thought about creating different versions of your work?"
