                      - text: I thought writing the book would be the hard part.It wasn’t.The hard part has been everything that came after it.Trying to work out what to do myself, what to outsource, how often to talk about the book without feeling like a broken record, where to show up, who to speak to and what people should do after they finish reading it.Reaching 1,000 copies sold made me stop and think about the things I’ve learned along the way.Some I got right.Some I learned the hard way.I’ve shared five of them in this week’s newsletter.A big thank you to
