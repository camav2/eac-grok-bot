                  - paragraph [ref=f100e1451]:
                    - generic [ref=f100e1452]:
                      - text: Yesterday was the worst day of my life. I’m not sure if today is any better. I lost my older brother Justin Silver, whom I call Yanga. The first person I remember in my life. Our mum’s heart is broken. Our dad lost a son. His siblings lost a brother. I lost the person who protected me and made it safe for me to follow my dreams and inspire countless others. It’s often challenging as an individual whose professional life has a personal impact on the lives of others to know how that feels like. I think I came to realise that very well over these last few days with the countless professionals whose actions had that profound and personal impact on our family. Yanga is an avid explorer and nature lover who had gone to Mt Barney on Thursday 10.09.2026 as he does on his other adventures which are in line with his character. He often camps at the places sometimes for a number of days as he likes catching the sunrises and sunsets. However, when the family could not reach him, we lodged a Police report with
                      - 'link "View company: Queensland Police Service" [ref=f100e1455] [cursor=pointer]':
                        - /url: https://www.linkedin.com/company/queensland-police-service/
                        - strong [ref=f100e1456]: Queensland Police Service
                      - text: which in a matter of time were able to locate his vehicle at the Yellow Pinch carpark at Mt Barney. What followed was several days of search with QPS officers thoughtfully in contact with my family and countless number of
                      - 'link "View company: Queensland State Emergency Service" [ref=f100e1458] [cursor=pointer]':
                        - /url: https://www.linkedin.com/company/queensland-state-emergency-service/
                        - strong [ref=f100e1459]: Queensland State Emergency Service
                      - text: (SES) volunteers who we couldn’t name one by one along with family and friends who were concerned. It wasn’t until Tuesday 21 of September 2026, when we received the news that he was unfortunately found deceased, but the cause of death is yet to be determined. I have been asked countless times how I feel, the truth is I don’t know. I definitely feel something, but I don’t know what it is. Justin was 3 years older than me. Having professional individuals like
                      - link "View Olamide Kowalik’s profile" [ref=f100e1461] [cursor=pointer]:
                        - /url: https://www.linkedin.com/in/olamide-kowalik-9b41a954/
                        - strong [ref=f100e1462]: Olamide Kowalik
