                        - text: "for a special online event:✨ 100 Conversations: Carer Edition📅 Wednesday 14 October🕖 7.00pm AEDT💻 Online — join from anywhere in Australia🎟️ FREE to attendThis isn’t a formal presentation or webinar. It’s a conversation — about caring, identity, the stories we carry, and what it means to make space for ourselves alongside the people we care for.Whether you identify strongly as a carer, are new to the caring role, have been caring for years, or perhaps haven’t even thought of yourself as a “carer” before, you are very welcome.Make a cuppa, find a comfortable spot and join us from wherever you are. 💛🎟️ Bookings are free, but registration is essential:"
