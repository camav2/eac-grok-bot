                        - text: 💛 Calling carers across AustraliaOne of the things I’m most passionate about is creating spaces where carers feel heard, seen and a little less alone.I’m a Melbourne-based author, storyteller and passionate advocate for recognising and supporting carers. I also bring my own lived experience of caring, and I know how powerful it can be to simply have an honest conversation with someone who understands that caring can hold so many things at once — love, responsibility, exhaustion, uncertainty, connection and hope.During National Carers Week, I’ll be joining
                        - link "View Sarah Martin’s profile" [ref=f65e3320] [cursor=pointer]:
