                        - text: "We’re at a knife’s edge 🔪 Real Estate Market Wrap 🗞️A Tamarama property sold at a mortgagee auction today for around $20.2 million, after selling for roughly $29.2 million in 2021.That’s a brutal reminder: the market doesn’t care what you paid, or what you still owe.In this Saturday market wrap, I talk about rate-rise fears, falling borrowing power and why a cheaper property can still be harder to afford.There are opportunities for buyers with cash and staying power. But if you’re under pressure to sell, waiting for the market to turn carries its own risk.Nobody rings a bell at the bottom.Make the decision that works for your finances.0:00 Tamarama mortgagee sale: roughly $9 million below its 2021 price0:44 Cash is king, and the market is at a knife’s edge1:19 How many more rate rises could be coming?1:55 What I’m seeing in Sydney and Melbourne3:02 Who bears the pain of fighting inflation?4:23 Recession fears and what the 1990s felt like6:13 Buying opportunities when fear takes hold6:49 Why trying to pick the bottom is so difficult8:26 The borrowing power paradox9:41 My first spring Saturday without an auction in over 30 years10:55 My take for buyers and sellers right nowWhat was it like in your market? Comment below..."
