                    - generic [ref=f48e1393]:
                      - text: I just got off the phone with a client - he's a CEO, devoted dad & partner, going through all the midlife stuff too:- what do I need to do to see my business flourish? What are my blindspots & who/how do I work on them?- how can I be the best father, partner AND leader all at the same time? Is that even realistic?- I've forgotten to look after myself and my health - where does that sit as a priority?When asked about how he felt he scored out of 10 about his level of influence and results in key areas of his life, he gave '4-5' - which is really a 4. During our 90 minute personal strategy session, I let him empty out the noise in his head, dig deeper on what's really important, where he'd like to be vs where he's at and created a few simple actions and quick wins to help him move from a 4 to a REAL 5. Then we'll keep taking steps to move that score up over time with some small achievable steps. To have him feeling less stuck > more spacious, lighter; with a plan and vision and some oomph to make it happen.By the end of the call, I saw him brighten up the screen and smile talking about his plans with his family, his team, vision and his focus for the week and month ahead. (Even liking the sound of accountability).----------------------I work with men helping them navigate life's crossroads and get back into the driver's seat. Sound like a mate you know? Or maybe it's you 😉 3 months til New Year's Day - now's the time to reach out and get moving.
