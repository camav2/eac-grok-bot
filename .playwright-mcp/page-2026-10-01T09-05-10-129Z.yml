                      - paragraph [ref=f48e373]:
                        - generic [ref=f48e374]:
                          - text: I was talking to a couple of friends about travel x tech recently and it was interesting to hear the guys (particularly) feeling like tech had somewhat ruined travel. I can see why that feels true, but I felt like tech had totally opened up travel from a safety perspective, especially for women, for LGBTQIA+ folk, and people with disabilities. Don’t get me wrong, social media hype element of travel x tech has made a lot of places pretty unbearable (to visit and live) and has of course had a lot of other bad stuff to answer for on its travel influence.1000% here for more scrawled email addresses, banana pancake cafe recommendations from strangers, creative problem solving required when travelling, and unexpected adventures that don’t come from the same sanitised AI itinerary that everyone else is following.
